<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Selector Wheel · Maths Tools</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #251639; color: #faf7ff; font: 1rem/1.5 system-ui,sans-serif }
main { max-width: 1060px; margin: auto; padding: 24px clamp(16px,4vw,48px) 40px }
a { color: #ddd0fc }
h1 { font-size: clamp(2rem,5vw,3.4rem); line-height: 1.1; letter-spacing: -.045em; margin: 22px 0 28px }
.layout { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(245px,1fr); align-items: start; gap: 24px }
.stage, aside { border: 1px solid #5f4774; border-radius: 20px; background: #302044; padding: clamp(16px,3vw,28px) }
.stage { text-align: center; background: radial-gradient(ellipse at center,#503262,#302044 76%) }
figure { position: relative; margin: 8px auto 16px; max-width: 440px }
canvas { width: 100%; display: block; border-radius: 50%; border: 5px solid #fff2e5; background: #4b385b; box-shadow: 0 6px 18px #130e2380 }
figure::after { content: ""; position: absolute; top: -7px; left: 50%; transform: translateX(-50%); border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 27px solid #fff; filter: drop-shadow(0 2px 2px #21132d) }
button, textarea { font: inherit }
button { cursor: pointer; padding: 10px 22px; border: 0; border-radius: 10px; font-weight: 700 }
#spin { background: #ffc962; color: #2b192c; min-width: 160px }
button:disabled { opacity: .5; cursor: default }
#result { font-size: clamp(1.5rem,4vw,2.4rem); overflow-wrap: anywhere; line-height: 1.2; font-weight: 750; margin: 8px 0 16px }
textarea { width: 100%; border: 1px solid #90789d; background: #241931; color: white; border-radius: 9px; padding: 10px; resize: vertical }
textarea::placeholder { color: #bbaac7 }
label { display: block; font-weight: 600 }
.hint, #count { color: #dfcfe9; margin: 3px 0 10px }
.options label { display: flex; align-items: center; gap: 9px; padding: 7px 0; cursor: pointer }
input { width: 20px; height: 20px; accent-color: #b390ff }
#reset { background: #504064; color: white; margin-top: 10px }
:focus-visible { outline: 3px solid #62e2ff; outline-offset: 3px }
@media(max-width:680px) { .layout { grid-template-columns: 1fr } }
</style>
</head>
<body><main>
<a href="../">← Maths Tools</a>
<h1>Student Selector Wheel</h1>
<div class="layout">
<section class="stage" aria-label="Student selection">
<figure><canvas id="wheel" width="900" height="900" aria-label="Student selector wheel"></canvas></figure>
<div id="result" role="status" aria-live="polite">Add your class list</div>
<button id="spin" disabled>Spin wheel</button>
</section>
<aside>
<label for="names">Class list</label>
<p class="hint" id="hint">Enter or paste one student per line.</p>
<textarea id="names" rows="8" aria-describedby="hint" placeholder="One name per line" spellcheck="false"></textarea>
<p id="count"></p>
<div class="options">
<label><input type="checkbox" id="instant">Instant select</label>
<label><input type="checkbox" id="remove">Remove selected student</label>
</div>
<button id="reset" disabled>Reset round</button>
</aside></div></main>
<script src="wheel.js"></script>
</body></html>
