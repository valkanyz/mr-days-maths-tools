<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Timer | Mr Day’s maths tools</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #26143e; color: #faf5ff; font: 1rem/1.5 system-ui, sans-serif; }
  main { width: min(100%, 60rem); margin: auto; padding: 1.5rem; }
  a { color: #e4c9fa; }
  h1, form, #status { text-align: center; }
  #clock { text-align: center; font-size: clamp(3rem, 17vw, 11rem); font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.2; }
  #status { min-height: 1.5em; margin: .75rem 0 1.5rem; }
  #clock.finished { color: #ffd78d; }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: end; gap: .75rem; }
  label { display: grid; gap: .25rem; text-align: left; }
  input, button { border: 1px solid #a583bd; border-radius: .5rem; padding: .6rem .8rem; font: inherit; }
  input { width: 6rem; background: #36204e; color: inherit; }
  button { background: #faf5ff; color: #26143e; font-weight: 700; cursor: pointer; }
  :focus-visible { outline: 3px solid #ffd78d; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <a href="../">← Maths tools</a>
  <h1>Class Timer</h1>
  <div id="clock" role="timer" aria-label="Time remaining">05:00</div>
  <p id="status" role="status"></p>
  <form class="controls" id="controls">
    <label>Minutes <input id="minutes" type="number" min="0" max="99" value="5" required></label>
    <label>Seconds <input id="seconds" type="number" min="0" max="59" value="0" required></label>
    <button id="toggle" type="submit">Start</button>
    <button id="reset" type="button">Reset</button>
  </form>
</main>
<script>
  const clock = document.getElementById('clock');
  const statusMessage = document.getElementById('status');
  const minutes = document.getElementById('minutes');
  const seconds = document.getElementById('seconds');
  const toggle = document.getElementById('toggle');
  const controls = document.getElementById('controls');

  const duration = () => (minutes.valueAsNumber * 60 + seconds.valueAsNumber) * 1000;
  let remaining = duration();
  let deadline = 0;
  let interval;

  function showTime() {
    const wholeSeconds = Math.ceil(remaining / 1000);
    const pad = value => String(value).padStart(2, '0');
    clock.textContent = pad(Math.floor(wholeSeconds / 60)) + ':' + pad(wholeSeconds % 60);
  }

  function stop() {
    clearInterval(interval);
    deadline = 0;
    minutes.disabled = seconds.disabled = false;
  }

  function reset() {
    stop();
    remaining = controls.checkValidity() ? duration() : 0;
    toggle.textContent = 'Start';
    statusMessage.textContent = '';
    clock.classList.remove('finished');
    showTime();
  }

  function tick() {
    remaining = Math.max(0, deadline - performance.now());
    showTime();
    if (remaining === 0) {
      stop();
      toggle.textContent = 'Start';
      statusMessage.textContent = 'Time’s up!';
      clock.classList.add('finished');
    }
  }

  controls.addEventListener('submit', event => {
    event.preventDefault();
    if (deadline) {
      tick();
      if (remaining > 0) {
        stop();
        toggle.textContent = 'Resume';
        statusMessage.textContent = 'Paused';
      }
      return;
    }

    if (remaining === 0) remaining = duration();
    if (remaining === 0) {
      statusMessage.textContent = 'Enter a time greater than zero.';
      return;
    }

    deadline = performance.now() + remaining;
    minutes.disabled = seconds.disabled = true;
    toggle.textContent = 'Pause';
    statusMessage.textContent = '';
    clock.classList.remove('finished');
    interval = setInterval(tick, 100);
  });

  document.getElementById('reset').addEventListener('click', reset);
  minutes.addEventListener('input', reset);
  seconds.addEventListener('input', reset);
</script>
</body>
</html>
