<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matrices Lab · Maths Tools</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="../">← Maths Tools</a><span>Applications · Specialist</span><button id="fullscreen">Full screen</button></header>
<main><div class="heading"><div><h1>Matrices Lab</h1><p>Explore the operation. Follow each entry.</p></div><label class="switch"><input type="checkbox" id="working" checked> Show working</label></div>
<div class="layout"><aside><section class="panel"><h2>Set up</h2><label for="operation">Operation</label><select id="operation"><optgroup label="Matrix arithmetic"><option value="multiply">A × B</option><option value="add">A + B</option><option value="subtract">A − B</option><option value="scale">kA</option><option value="transpose">Transpose Aᵀ</option><option value="power">Power Aⁿ</option></optgroup><optgroup label="Specialist"><option value="determinant">Determinant det(A)</option><option value="inverse">Inverse A⁻¹</option><option value="solve">Solve AX = B</option><option value="transform">Transformation AB</option></optgroup><optgroup label="Applications"><option value="transition">Transition AⁿB</option></optgroup></select>
<div id="scalarWrap" hidden><label for="scalar">Scalar k</label><input id="scalar" value="2" inputmode="decimal"></div><div id="powerWrap" hidden><label for="power">Power / number of steps n</label><input id="power" type="number" min="0" max="20" step="1" value="2"></div>
<label for="example">Load an example</label><select id="example"><option value="">Choose an example…</option><option value="sales">Applications · canteen sales</option><option value="travel">Applications · travel choices</option><option value="equations">Specialist · simultaneous equations</option><option value="rotate">Specialist · 90° rotation</option><option value="shear">Specialist · shear</option><option value="inverse">Specialist · 3 × 3 inverse</option></select><p id="context" class="hint">Change any entry. Fractions such as 1/3 are accepted.</p>
<div class="actions"><button id="swap">Swap A and B</button><button id="identity">A = identity</button></div><label for="precision">Display precision</label><select id="precision"><option value="2">2 decimal places</option><option value="4" selected>4 decimal places</option><option value="6">6 decimal places</option></select><p class="hint">Trailing zeros are omitted. Calculations use unrounded values.</p></section></aside>
<div class="workspace"><section class="panel equation-panel"><div class="matrix-equation" aria-label="Matrix calculation"><span id="aPrefix" class="operation-symbol" hidden></span><div class="operand"><div id="editA"></div><sup id="aSuffix" hidden></sup></div><span id="operationSymbol" class="operation-symbol">×</span><div id="editB" class="operand"></div><span id="equalsSymbol" class="operation-symbol">=</span><div class="operand result-operand"><div class="result-heading"><h2 id="resultTitle">AB</h2><span id="order" class="badge"></span></div><div id="output" aria-live="polite"></div></div></div><p id="dimensions" class="hint"></p><div id="error" role="alert" hidden></div><div id="diagram"></div></section>
<section id="workPanel" class="panel"><div class="result-heading"><h2>Working</h2><div class="actions"><button id="previous" aria-label="Previous output entry">←</button><span id="cellPosition"></span><button id="next" aria-label="Next output entry">→</button></div></div><p id="workHint" class="hint">Select an output entry to inspect its calculation.</p><div id="workingContent"></div></section></div></div></main><script src="engine.js"></script><script src="app.js"></script></body></html>
