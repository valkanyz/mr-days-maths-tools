<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tree Diagram Lab · Mr Day’s Maths Tools</title><style>
*{box-sizing:border-box}body{margin:0;background:#26143e radial-gradient(#b99bdf1b 1px,transparent 1px);background-size:20px 20px;color:#faf5ff;font:15px/1.5 system-ui,sans-serif}header,main{max-width:1680px;margin:auto;padding:22px 28px}header{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff20}.brand{font-size:21px;font-weight:750}header a{color:#d9c5eb;text-decoration:none;font-size:13px}.eyebrow{font-size:10px;letter-spacing:2px;color:#c9afe4;font-weight:750}h1{font-size:30px;letter-spacing:-1px;margin:4px 0 20px}h2{font-size:17px;margin:0}p{margin:8px 0}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px}.panel{background:#fcf9ff;color:#392746;border:1px solid #e4d6ed;border-radius:18px;box-shadow:0 10px 25px #0d042530}.controls{padding:22px}button,input,select{font:inherit;color:#41304e;border:1px solid #d8c9e2;background:white;border-radius:8px;padding:9px 10px;min-width:0}button{cursor:pointer;font-weight:650}button:hover{background:#eee3f7}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #d9a545;outline-offset:3px}input[type=checkbox]{accent-color:#7952a5;width:17px;height:17px}label{font-size:12px;font-weight:600;color:#715b80}select{width:100%}.section{border-top:1px solid #e8dfee;padding-top:16px;margin-top:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.check{display:flex;align-items:center;gap:8px;margin:12px 0}.small{font-size:11px;color:#80698f;line-height:1.5}.outcome{display:grid;grid-template-columns:12px minmax(0,1fr) 56px 28px;gap:6px;align-items:center;margin:8px 0}.outcome input{width:100%;padding:8px;font-size:13px}.outcome button{padding:4px}.swatch{width:9px;height:24px;border-radius:5px}.primary{background:#e7433d;border-color:#e7433d;color:white;padding:12px;width:100%;box-shadow:0 3px 0 #ac2b2d;margin-top:16px}.primary:hover{background:#d53630}.error{color:#a9243a;font-size:12px;min-height:18px;margin-top:10px}.stage{min-width:0;display:flex;flex-direction:column;overflow:hidden}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px;border-bottom:1px solid #e8dfee}.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.actions button{font-size:12px;padding:7px 10px}.board{overflow:auto;min-height:450px;max-height:740px;padding:16px;background:linear-gradient(#fff9,#fff9),radial-gradient(#bca6cf 1px,transparent 1px);background-size:auto,20px 20px}.board svg{display:block;margin:auto;max-width:none;font-family:system-ui,sans-serif}.note{font-size:12px;color:#705b80;padding:14px 22px;border-top:1px solid #e8dfee}.badge{font-size:11px;background:#eee4f7;color:#7952a5;padding:5px 9px;border-radius:20px}.empty{padding:70px 25px;text-align:center;color:#80698f}.footer{font-size:11px;color:#bda6d0;margin-top:20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 label{display:block;margin-bottom:5px}[hidden]{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px}.section{margin:0;border:0;padding:0}.setup{grid-column:1/-1}.primary{margin-top:0}.board{max-height:650px}.toolbar{padding:16px}}@media(max-width:480px){header,main{padding:18px 14px}.brand{font-size:17px}h1{font-size:26px}.controls{display:block}.section{margin-top:18px;padding-top:16px;border-top:1px solid #e8dfee}.primary{margin-top:16px}.board{min-height:350px}}
</style></head><body><header><div class="brand">⑂ Tree Diagram Lab</div><a href="../">← All maths tools</a></header><main><div class="eyebrow">PROBABILITY · ONE BRANCH AT A TIME</div><h1>Build the possibilities.</h1><div class="layout"><aside class="panel controls"><div class="setup"><label for="preset">Start with an example</label><select id="preset"><option value="coin">Coin tosses</option><option value="bag">Counters in a bag</option><option value="dice">Two dice</option></select></div><section class="section"><div class="row"><h2>Outcomes</h2><button id="add" aria-label="Add outcome">＋</button></div><label class="check"><input type="checkbox" id="weighted">Weighted outcomes</label><div class="row small"><span>Outcome name</span><span id="countLabel">Equal weights</span></div><div id="outcomes"></div><p class="small" id="weightHelp"></p></section><section class="section"><div class="grid2"><div><label for="stages">Stages / draws</label><select id="stages"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div><div><label for="replacement">After each draw</label><select id="replacement"><option value="yes">Replace</option><option value="no">Keep out</option></select></div></div><p class="small" id="drawHelp"></p></section><section class="section"><h2>Show on the tree</h2><label class="check"><input type="checkbox" id="labels" checked>Branch labels</label><label class="check"><input type="checkbox" id="probabilities">Calculate probabilities</label><div id="formatControl" hidden><label for="format">Probability format</label><select id="format"><option value="fraction">Fractions</option><option value="percent">Percentages</option><option value="decimal">Decimals</option></select></div><button class="primary" id="build">Build tree</button><p id="error" class="error" role="alert"></p></section></aside><section class="panel stage"><div class="toolbar"><div class="row"><h2>Your tree</h2><span class="badge" id="paths"></span></div><div class="actions"><button id="out" aria-label="Zoom out">−</button><span id="zoom" class="small">100%</span><button id="in" aria-label="Zoom in">＋</button><button id="fit">Fit width</button><button id="export">Save SVG</button></div></div><div class="board" id="board" tabindex="0" aria-label="Tree diagram. Scroll to explore larger trees."></div><div class="note" id="note"></div></section></div><div class="footer">Mr Day’s Maths Tools · Up to 6 outcomes, 4 stages and 256 paths · Silent, browser-based exploration</div></main><script src="engine.js"></script><script>
const $=id=>document.getElementById(id),colors=['#7952a5','#16877b','#c07c22','#b84572','#4275b2','#747747'];let outcomes=[{name:'Heads',count:1},{name:'Tails',count:1}],result=null,scale=1,width=900,lastConfig=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function editor(){ $('outcomes').innerHTML=outcomes.map((o,i)=>`<div class="outcome"><span class="swatch" style="background:${colors[i]}"></span><input aria-label="Outcome ${i+1} name" maxlength="20" data-name="${i}" value="${esc(o.name)}"><input aria-label="Outcome ${i+1} count" type="number" min="1" max="50" step="1" data-count="${i}" value="${o.count}" ${$('weighted').checked?'':'disabled'}><button aria-label="Remove outcome ${i+1}" data-remove="${i}" ${outcomes.length<=2?'disabled':''}>×</button></div>`).join('');$('add').disabled=outcomes.length>=6;help()}
function help(){$('countLabel').textContent=$('weighted').checked?'Item count':'Equal weights';$('weightHelp').textContent=$('weighted').checked?'Counts set the weights: 3 red and 2 blue gives 3/5 and 2/5. Use 1–50 items per outcome.':'Each outcome starts with one item and the same chance.';$('drawHelp').textContent=$('replacement').value==='yes'?'Return the item each time. Chances stay the same.':'Keep the item out. Counts decrease along each path; impossible branches are omitted.';}
function fmt(p){if($('format').value==='fraction')return TreeMath.text(p);let v=Number(p.n)/Number(p.d),percent=$('format').value==='percent';const places=percent?1:3,raw=percent?v*100:v,rounded=Number(raw.toFixed(places));return (Math.abs(raw-rounded)>1e-10?'≈ ':'')+rounded+(percent?'%':'')}
function build(){try{const weighted=$('weighted').checked,config={outcomes:outcomes.map((o,i)=>({name:o.name.trim()||`Outcome ${i+1}`,count:o.count})),stages:Number($('stages').value),replacement:$('replacement').value==='yes',weighted};result=TreeMath.build(config);lastConfig=config;$('error').textContent='';scale=1;draw()}catch(e){result=null;$('error').textContent=e.message;$('board').innerHTML='<div class="empty">Adjust your settings, then build the tree.</div>';$('paths').textContent='';$('note').textContent='';$('export').disabled=true}help()}
function draw(){if(!result)return;const labels=$('labels').checked,probs=$('probabilities').checked; $('formatControl').hidden=!probs;const {tree,leaves}=result;const step=240,left=45,top=75,gap=probs?68:52,height=Math.max(300,top+leaves.length*gap+25);width=left+lastConfig.stages*step+210;leaves.forEach((n,i)=>n.y=top+i*gap);function position(n){n.x=left+n.depth*step;if(n.children.length){n.children.forEach(position);n.y=(n.children[0].y+n.children.at(-1).y)/2}}position(tree);let lines='',nodes='';function walk(n){for(const c of n.children){const color=colors[c.outcome],midX=n.x+step*.62,midY=n.y+(c.y-n.y)*.62;lines+=`<path d="M${n.x} ${n.y}L${c.x} ${c.y}" fill="none" stroke="${color}" stroke-width="2" opacity=".65"/>`;let texts=[];if(labels)texts.push(lastConfig.outcomes[c.outcome].name);if(probs)texts.push(fmt(c.branch));if(texts.length){const box=Math.max(...texts.map(t=>t.length))*7+16;nodes+=`<rect x="${midX-box/2}" y="${midY-13}" width="${box}" height="${texts.length*19+4}" rx="5" fill="#fcf9ff"/>`;texts.forEach((t,j)=>nodes+=`<text x="${midX}" y="${midY+j*19}" text-anchor="middle" font-size="13" fill="${j===0&&labels?color:'#493553'}">${esc(t)}</text>`)}walk(c)}nodes+=`<circle cx="${n.x}" cy="${n.y}" r="${n.depth?4:7}" fill="${n.depth?colors[n.outcome]:'#493553'}"/>`;if(!n.children.length){const path=n.path.map(i=>lastConfig.outcomes[i].name).join(' → ');nodes+=`<text x="${n.x+16}" y="${n.y-6}" font-size="11" fill="#80698f">Path ${leaves.indexOf(n)+1}</text>`;if(probs)nodes+=`<text x="${n.x+16}" y="${n.y+14}" font-size="15" font-weight="700" fill="#493553">${esc(fmt(n.p))}</text>`;nodes+=`<title>${esc(labels?path:'Path '+(leaves.indexOf(n)+1))}${probs?' = '+esc(fmt(n.p)):''}</title>`}}
walk(tree);let headings='';for(let i=1;i<=lastConfig.stages;i++)headings+=`<text x="${left+i*step-step/2}" y="28" font-size="12" fill="#80698f" text-anchor="middle">Stage ${i}</text>`;if(probs)headings+=`<text x="${left+lastConfig.stages*step+16}" y="28" font-size="12" fill="#80698f">Path probability</text>`;$('board').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width*scale}" height="${height*scale}" role="img" aria-label="${leaves.length} possible paths across ${lastConfig.stages} stages. ${lastConfig.replacement?'With':'Without'} replacement."><rect width="100%" height="100%" fill="#fcf9ff"/>${headings}${lines}${nodes}</svg>`;$('paths').textContent=leaves.length+' paths';$('zoom').textContent=Math.round(scale*100)+'%';$('note').textContent=probs?'Multiply branch probabilities along a path. The probabilities of all complete paths sum to 1. Rounded displays may not add exactly to 1.':'Probabilities are hidden. Use the tree to predict the possible outcomes. Scroll to explore larger trees.';$('export').disabled=false;}
$('outcomes').oninput=e=>{if(e.target.dataset.name!==undefined)outcomes[Number(e.target.dataset.name)].name=e.target.value;if(e.target.dataset.count!==undefined)outcomes[Number(e.target.dataset.count)].count=Number(e.target.value);$('error').textContent='Settings changed. Select Build tree to apply.'};$('outcomes').onclick=e=>{if(e.target.dataset.remove===undefined)return;outcomes.splice(Number(e.target.dataset.remove),1);editor();build()};$('add').onclick=()=>{outcomes.push({name:`Outcome ${outcomes.length+1}`,count:1});editor();build()};$('weighted').onchange=()=>{editor();build()};$('replacement').onchange=build;$('stages').onchange=build;$('build').onclick=build;for(const id of ['labels','probabilities','format'])$(id).onchange=()=>{$('formatControl').hidden=!$('probabilities').checked;draw()};$('in').onclick=()=>{scale=Math.min(2,scale+.15);draw()};$('out').onclick=()=>{scale=Math.max(.15,scale-.15);draw()};$('fit').onclick=()=>{scale=Math.min(1,Math.max(.15,($('board').clientWidth-32)/width));draw()};$('preset').onchange=()=>{const p=$('preset').value;outcomes=p==='coin'?[{name:'Heads',count:1},{name:'Tails',count:1}]:p==='bag'?[{name:'Red',count:3},{name:'Blue',count:2}]:Array.from({length:6},(_,i)=>({name:String(i+1),count:1}));$('weighted').checked=p==='bag';$('replacement').value=p==='bag'?'no':'yes';$('stages').value='2';editor();build()};$('export').onclick=()=>{const svg=$('board').querySelector('svg');if(!svg)return;const url=URL.createObjectURL(new Blob([svg.outerHTML],{type:'image/svg+xml'})),a=document.createElement('a');a.href=url;a.download='tree-diagram.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};editor();build();
</script></body></html>
