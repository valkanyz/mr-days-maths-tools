<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive mathematics labs for secondary school: functions, statistics, distributions, trigonometry, finance, vectors, complex numbers and networks."><title>Maths Labs · Mr Day’s Maths Tools</title><style>*{box-sizing:border-box}body{margin:0;color:#3e2d4e;background:#26143e radial-gradient(#b79ad31c 1px,transparent 1px);background-size:20px 20px;font:15px/1.5 system-ui,sans-serif}header,main{max-width:1600px;margin:auto;padding:16px 25px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #ffffff20;color:#fff}.brand{font-size:20px;font-weight:750}a{color:#dac4ed;text-decoration:none}header a{font-size:12px}h1{color:#fff;font-size:29px;letter-spacing:-1px;margin:2px 0 14px}h2{font-size:16px;margin:0 0 12px}h3{font-size:13px;margin:15px 0 8px}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#c9aee1;font-weight:750}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}.panel{background:#fcf9ff;border:1px solid #e5d9ed;border-radius:18px;box-shadow:0 12px 28px #13082135}.controls{padding:18px;max-height:calc(100dvh - 255px);overflow:auto}.section{border-top:1px solid #e7deed;padding-top:13px;margin-top:14px}label{display:block;font-size:12px;color:#725a82;font-weight:650;margin:10px 0 5px}input,select,textarea,button{font:inherit;border:1px solid #d9c9e4;color:#443150;background:white;border-radius:8px;padding:8px 10px;min-width:0}input:not([type=checkbox]):not([type=range]),select,textarea{width:100%}textarea{resize:vertical;font-size:13px;min-height:100px}input[type=range]{width:100%;padding:0;accent-color:#8252b5}input[type=checkbox]{accent-color:#8252b5}button{cursor:pointer;font-size:12px;font-weight:650}button:hover{background:#eee2f9}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d5a64c;outline-offset:2px}.check{display:flex;gap:8px;align-items:center;margin:12px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{background:#e7433d;color:white;border:0;box-shadow:0 3px 0 #b32e30}.primary:hover{background:#d83532}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stage{padding:18px;min-width:0}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.bar h2{margin:0}.chip{font-size:10px;background:#eee5f7;color:#795295;padding:5px 9px;border-radius:20px}.viz{width:100%;height:clamp(290px,42dvh,560px);border-radius:12px;background:#fff;overflow:hidden}.viz svg{user-select:none;display:block;width:100%;height:100%;font-family:system-ui,sans-serif}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-top:14px}.stat{padding:12px;background:#f3ecf9;border:1px solid #e8dcee;border-radius:10px}.stat small{display:block;font-size:11px;color:#80658f}.stat strong{font-size:19px;display:block;overflow-wrap:anywhere}.note{font-size:12px;color:#755f82;padding:12px 14px;background:#f4edf9;border-radius:10px;margin-top:13px}.error{color:#a62741;font-size:12px;min-height:18px;margin-top:10px}.muted{font-size:11px;color:#846c92}.tablewrap{max-height:190px;overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:right;padding:7px 10px;border-bottom:1px solid #e8dfed}th{position:sticky;top:0;background:#eee4f7}td:first-child,th:first-child{text-align:left}.formula{font-size:17px;color:#5c3d76;font-weight:650;margin:6px 0 12px;overflow-wrap:anywhere}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:#7d688a;margin:6px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.footer{font-size:10px;color:#bca6ce;margin-top:16px}.hidden,[hidden]{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}.controls{max-height:none}.viz{height:360px}header,main{padding:15px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.controls>h2,.controls>.section,.controls>.actions,.controls>.error,.controls>.wide{grid-column:1/-1}.section{margin-top:0}.results{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.controls{display:block}.viz{height:300px}.brand{font-size:16px}.stage{padding:12px}h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div id="brand" class="brand">Maths Labs</div><a href="../">← All maths tools</a></header><main><div class="eyebrow" id="tag"></div><h1 id="subtitle"></h1><div class="layout"><aside><div class="panel" style="padding:12px 18px;margin-bottom:12px"><label for="activity" style="margin-top:0">Activity</label><select id="activity"></select></div><div class="panel controls" id="controls"></div></aside><section class="panel stage"><div class="bar"><h2 id="title"></h2><span class="chip">EXPLORE · PREDICT · REVEAL</span></div><div id="formula" class="formula"></div><div id="legend" class="legend"></div><div id="viz" class="viz"></div><div id="results" class="results" aria-live="polite"></div><div id="note" class="note"></div><details style="margin-top:14px"><summary style="font-size:12px;color:#765f87;cursor:pointer">Data table</summary><div id="table" class="tablewrap"></div></details></section></div><div class="footer">Mr Day’s Maths Tools · Silent, browser-based exploration</div></main><script src="maths.js"></script><script>const $=id=>document.getElementById(id),M=Maths,C={purple:'#8050b4',teal:'#078477',red:'#d24452',blue:'#287caf',gold:'#b57618'},fmt=(x,d=3)=>x===null||!Number.isFinite(x)?'—':Number(x.toFixed(d)).toLocaleString('en-AU',{maximumFractionDigits:d}),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current='',update=()=>{},exportRows=[];
function input(id,label,value,min=-100,max=100,step='any'){return `<div><label for="${id}">${label}</label><input id="${id}" type="number" value="${value}" min="${min}" max="${max}" step="${step}"></div>`}
function slider(id,label,value,min,max,step=.1){return `<div><label for="${id}">${label} <output id="${id}val">${value}</output></label><input id="${id}" type="range" value="${value}" min="${min}" max="${max}" step="${step}"></div>`}
function select(id,label,options){return `<div><label for="${id}">${label}</label><select id="${id}">${options.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div>`}
function check(id,label,checked=false){return `<label class="check"><input id="${id}" type="checkbox" ${checked?'checked':''}>${label}</label>`}
const pair=(a,b)=>`<div class="pair wide">${a}${b}</div>`;
function value(id){const el=$(id),v=Number(el.value);if(el.value.trim()===''||!Number.isFinite(v)||v<Number(el.min)||v>Number(el.max)||(el.step==='1'&&!Number.isInteger(v)))throw Error('Check '+(document.querySelector(`label[for="${id}"]`)?.textContent||id)+'.');return v}
let changedControl='',softWarning='';
function showControl(id,show){const el=$(id);if(!el)return;const wrap=el.closest('label.check')||el.parentElement;wrap.hidden=!show;if(wrap.parentElement.classList.contains('pair'))wrap.parentElement.hidden=[...wrap.parentElement.children].every(c=>c.hidden)}
function controls(html){$('controls').hidden=false;$('controls').innerHTML=html+`<section class="section">${check('reveal','Show calculated results',true)}<div class="actions"><button id="reset">Reset activity</button><button id="csv">Export table</button></div><div id="error" class="error" role="alert"></div></section>`;$('reset').onclick=()=>launch(current);$('csv').onclick=()=>{if(!exportRows.length)return;download(exportRows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),current+'-results.csv','text/csv')};$('controls').oninput=e=>{changedControl=e.target.id;if(e.target.type==='range')$(e.target.id+'val').textContent=e.target.value;run()};$('controls').onchange=e=>{changedControl=e.target.id;run()}}
function run(){try{softWarning='';exportRows=[];for(const el of $('controls').querySelectorAll('input,select'))showControl(el.id,true);update();for(const el of $('controls').querySelectorAll('input,select')){if(el.dataset.keepVisible!=='true'&&el.id!=='csv'&&el.disabled)showControl(el.id,false)}$('error').textContent=softWarning;$('results').hidden=!$('reveal').checked;$('table').hidden=!$('reveal').checked;$('csv').disabled=!$('reveal').checked||!exportRows.length}catch(e){$('error').textContent=e.message;$('results').innerHTML='';$('table').innerHTML='';$('viz').innerHTML='';$('formula').textContent='';$('csv').disabled=true}}
function results(items){$('results').innerHTML=items.map(([label,v])=>`<div class="stat"><small>${esc(label)}</small><strong>${esc(v)}</strong></div>`).join('')}
function note(s){$('note').textContent=s}function formula(s){$('formula').textContent=s}
function table(headers,rows){exportRows=[headers,...rows];$('table').innerHTML=`<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function download(s,name,type){const u=URL.createObjectURL(new Blob([s],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function svg(content,label){$('viz').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-label="${esc(label)}"><defs><clipPath id="plotclip"><rect x="60" y="25" width="750" height="365"/></clipPath><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="context-stroke"/></marker></defs>${content}</svg>`}
function chart(xmin,xmax,ymin,ymax,xlabel='x',ylabel='y',equal=false, ticks={}){if(typeof current!=='undefined'&&['statistics','finance','ratios'].includes(current)&&!(current==='ratios'&&$('mode')?.value==='value')){const ints=(a,b)=>{const step=Math.max(1,Math.ceil((b-a)/6));return Array.from({length:Math.floor((Math.floor(b)-Math.ceil(a))/step)+1},(_,i)=>Math.ceil(a)+i*step)};if(current==='statistics'||current==='ratios'){xmin=Math.floor(xmin);xmax=Math.ceil(xmax);ticks.x=ints(xmin,xmax)}ymin=Math.floor(ymin);ymax=Math.ceil(ymax);ticks.y=ints(ymin,ymax);if(current==='finance'){const span=Math.max(1,ymax-ymin),raw=span/6,mag=10**Math.floor(Math.log10(raw)),step=Math.max(1,([1,2,5,10].find(v=>v*mag>=raw)||10)*mag);ymin=Math.floor(Math.min(0,ymin)/step)*step;ymax=Math.ceil(ymax/step)*step;if(ymax===ymin)ymax=ymin+step;ticks.y=Array.from({length:Math.round((ymax-ymin)/step)+1},(_,i)=>ymin+i*step)}}if(xmin===xmax){xmin--;xmax++}if(ymin===ymax){ymin--;ymax++}if(equal){const dy=(xmax-xmin)*365/750;if(dy>ymax-ymin){const mid=(ymin+ymax)/2;ymin=mid-dy/2;ymax=mid+dy/2}else{const dx=(ymax-ymin)*750/365,mid=(xmin+xmax)/2;xmin=mid-dx/2;xmax=mid+dx/2}}const X=x=>60+(x-xmin)/(xmax-xmin)*750,Y=y=>390-(y-ymin)/(ymax-ymin)*365;let s='';const xt=ticks.x||Array.from({length:6},(_,i)=>xmin+(xmax-xmin)*i/5),ystep=Math.max(1,Math.ceil((ymax-ymin)/6)),yt=ticks.y|| (ylabel==='Frequency'?Array.from({length:Math.floor((ymax-ymin)/ystep)+1},(_,i)=>Math.ceil(ymin)+i*ystep):Array.from({length:6},(_,i)=>ymin+(ymax-ymin)*i/5));for(const x of xt)s+=`<path d="M${X(x)} 25V390" stroke="#e5deec"/><text x="${X(x)}" y="410" text-anchor="middle" font-size="11" fill="#806b91">${ticks.formatX?ticks.formatX(x):fmt(x,2)}</text>`;for(const y of yt)s+=`<path d="M60 ${Y(y)}H810" stroke="#e5deec"/><text x="51" y="${Y(y)+4}" text-anchor="end" font-size="11" fill="#806b91">${fmt(y,2)}</text>`;s+=`<path d="M60 ${Y(Math.max(ymin,Math.min(ymax,0)))}H810 M${X(Math.max(xmin,Math.min(xmax,0)))} 25V390" stroke="#9d86ad"/><text x="435" y="435" text-anchor="middle" font-size="12" fill="#6e537e">${esc(xlabel)}</text><text transform="translate(15 210) rotate(-90)" text-anchor="middle" font-size="12" fill="#6e537e">${esc(ylabel)}</text>`;return{X,Y,s,xmin,xmax,ymin,ymax}}
function curve(g,f,color=C.purple){let d='',pen=false;for(let i=0;i<=700;i++){const x=g.xmin+(g.xmax-g.xmin)*i/700,y=f(x);if(Number.isFinite(y)&&Math.abs(g.Y(y))<10000){d+=(pen?'L':'M')+g.X(x)+','+g.Y(y);pen=true}else pen=false}return `<path clip-path="url(#plotclip)" d="${d}" fill="none" stroke="${color}" stroke-width="3"/>`}
const line=(g,a,b,color=C.teal,dash='')=>`<path clip-path="url(#plotclip)" d="M${g.X(a[0])} ${g.Y(a[1])}L${g.X(b[0])} ${g.Y(b[1])}" fill="none" stroke="${color}" stroke-width="2.5" ${dash?'stroke-dasharray="'+dash+'"':''}/>`;
const point=(g,x,y,color=C.red,r=5)=>`<circle clip-path="url(#plotclip)" cx="${g.X(x)}" cy="${g.Y(y)}" r="${r}" fill="${color}"/>`;
function legend(items){$('legend').innerHTML=items.map(([t,c])=>`<span><i class="dot" style="background:${c}"></i>${esc(t)}</span>`).join('')}
function padded(a){let lo=Math.min(...a),hi=Math.max(...a),pad=(hi-lo)*.12||1;return [lo-pad,hi+pad]}
const labs={
 functions:{title:'Function Lab',tag:'YEARS 8–10 · METHODS',subtitle:'Change the rule. Watch the graph.',setup(){controls(select('type','Function family',[['linear','Linear'],['quadratic','Quadratic'],['cubic','Cubic'],['sine','Sine (radians)'],['exponential','Exponential eˣ']])+slider('a','Vertical scale a',1,-4,4,.5)+slider('b','Horizontal factor b',1,-3,3,.5)+slider('h','Horizontal shift h',0,-5,5)+slider('k','Vertical shift k',0,-5,5,.5)+pair(input('range','View ±',8,2,30),input('at','Point x₀',1,-30,30))+check('tangent','Show tangent')+check('integral','Shade signed integral')+pair(input('lo','Lower limit',0,-30,30),input('hi','Upper limit',2,-30,30)));update=()=>{const type=$('type').value,a=value('a'),b=value('b'),h=value('h'),k=value('k'),r=value('range'),at=value('at'),lo=value('lo'),hi=value('hi'),F=M.family(type,a,b,h,k);if(lo>hi)throw Error('Lower limit must not exceed upper limit.');const rule={linear:'u',quadratic:'u²',cubic:'u³',sine:'sin(u)',exponential:'eᵘ'}[type];formula(`y = ${a} × ${rule} + ${k}, where u = ${b}(x − ${h})`);const g=chart(-r,r,-r,r,'x','y'),d=F.d(at),y=F.f(at);let s=g.s;if($('integral').checked){let pts=`${g.X(lo)},${g.Y(0)} `;for(let i=0;i<=240;i++){const x=lo+(hi-lo)*i/240;pts+=`${g.X(x)},${g.Y(F.f(x))} `}pts+=`${g.X(hi)},${g.Y(0)}`;s+=`<polygon points="${pts}" fill="${C.teal}" opacity=".15" clip-path="url(#plotclip)"/>`}s+=curve(g,F.f);if($('tangent').checked){s+=curve(g,x=>y+d*(x-at),C.gold)+point(g,at,y)}svg(s,'Function graph with optional tangent and signed integral');legend([['Function',C.purple],['Tangent',C.gold],['Integral region',C.teal]]);results([['f(x₀)',fmt(y)],['Gradient f′(x₀)',fmt(d)],['Signed integral',fmt(F.integral(lo,hi))]]);note('Sliders update the graph immediately. Sine uses radians. The shaded integral is signed: area below the x-axis contributes negatively. A flat graph occurs when a or b is zero.');table(['x','f(x)'],Array.from({length:9},(_,i)=>{const x=-r+i*r/4;return[fmt(x),fmt(F.f(x))]}))};}},
 statistics:{title:'Statistics Lab',tag:'YEARS 7–10 · APPLICATIONS',subtitle:'See the story in the data.',setup(){controls(select('mode','Investigation',[['one','One-variable data'],['two','Scatterplot and regression']])+`<div class="wide"><label for="data">Data (commas or spaces; pairs on separate lines)</label><textarea id="data" rows="5">4, 5, 5, 6, 7, 7, 8, 9, 10, 12, 18</textarea></div>`+select('display','One-variable display',[['box','Box plot'],['hist','Histogram'],['dots','Dot plot']])+input('bins','Histogram bins',6,2,20,1)+check('fitline','Show regression line',true));$('mode').onchange=()=>{$('data').value=$('mode').value==='one'?'4, 5, 5, 6, 7, 7, 8, 9, 10, 12, 18':'1, 2\n2, 4\n3, 3\n4, 6\n5, 8\n6, 8';run()};update=()=>{const two=$('mode').value==='two';$('display').disabled=two;$('bins').disabled=two;$('fitline').disabled=!two;const raw=$('data').value.trim();if(!raw)throw Error('Enter data to begin.');if(two){const p=raw.split(/\n|;/).filter(x=>x.trim()).map(row=>row.trim().split(/[ ,\t]+/).map(Number));if(p.length>300||p.some(r=>r.length!==2||r.some(x=>!Number.isFinite(x)||Math.abs(x)>1e6)))throw Error('Enter up to 300 x,y pairs, one pair per line (values within ±1,000,000).');const R=M.regression(p),g=chart(...padded(p.map(p=>p[0])),...padded(p.map(p=>p[1])));let s=g.s+p.map(([x,y])=>point(g,x,y,C.purple)).join('');if($('fitline').checked)s+=curve(g,x=>R.m*x+R.c,C.teal);svg(s,'Scatterplot and optional least-squares regression line');formula($('reveal').checked?`ŷ = ${fmt(R.m)}x ${R.c<0?'−':'+'} ${fmt(Math.abs(R.c))}`:'Predict the relationship before revealing the results.');results([['Pairs',p.length],['Correlation r',fmt(R.r)],['r²',R.r===null?'—':fmt(R.r**2)],['Gradient',fmt(R.m)]]);note('Least-squares regression predicts y from x. Correlation describes linear association; it does not establish causation. A constant y gives undefined r.');table(['x','y','Predicted y','Residual'],p.map(([x,y])=>[x,y,fmt(R.m*x+R.c),fmt(y-R.m*x-R.c)]));legend([['Data',C.purple],['Regression',C.teal]]);return}const data=raw.split(/[\s,;]+/).map(Number);if(data.length>500||data.some(x=>!Number.isFinite(x)||Math.abs(x)>1e6))throw Error('Enter up to 500 finite values within ±1,000,000.');const S=M.stats(data),[lo,hi]=padded(data),mode=$('display').value;let g=chart(lo,hi,0,5,'Value',mode==='box'?'':'Frequency'),s='';if(mode==='box'){s=`<path d="M60 350H810" stroke="#b6a0c5"/>`;for(let i=0;i<=5;i++){const v=lo+(hi-lo)*i/5;s+=`<path d="M${g.X(v)} 345v10" stroke="#b6a0c5"/><text x="${g.X(v)}" y="376" text-anchor="middle" font-size="12" fill="#806b91">${fmt(v,2)}</text>`}const good=S.a.filter(x=>!S.outliers.includes(x)),low=good[0],high=good.at(-1),Y=205;s+=`<path d="M${g.X(low)} ${Y}H${g.X(high)} M${g.X(low)} ${Y-22}V${Y+22} M${g.X(high)} ${Y-22}V${Y+22}" stroke="${C.purple}" stroke-width="3"/><rect x="${g.X(S.q1)}" y="${Y-42}" width="${Math.max(1,g.X(S.q3)-g.X(S.q1))}" height="84" fill="#e4d4f2" stroke="${C.purple}" stroke-width="2"/><path d="M${g.X(S.median)} ${Y-42}V${Y+42}" stroke="${C.red}" stroke-width="3"/>`;s+=S.outliers.map(x=>`<circle cx="${g.X(x)}" cy="${Y}" r="5" fill="${C.gold}"/>`).join('');if($('reveal').checked)for(const [x,l] of [[S.q1,'Q₁'],[S.median,'Median'],[S.q3,'Q₃']])s+=`<text x="${g.X(x)}" y="140" text-anchor="middle" font-size="12" fill="#765487">${l}: ${fmt(x)}</text>`}else if(mode==='hist'){const n=value('bins'),min=S.min,max=S.max===S.min?S.min+1:S.max,w=(max-min)/n,counts=Array(n).fill(0);data.forEach(x=>counts[Math.min(n-1,Math.floor((x-min)/w))]++);g=chart(min,max,0,Math.max(...counts)*1.15,'Value','Frequency');s=g.s;counts.forEach((c,i)=>s+=`<rect x="${g.X(min+i*w)}" y="${g.Y(c)}" width="${750/n}" height="${g.Y(0)-g.Y(c)}" fill="${C.purple}" opacity=".7" stroke="white"/>`)}else{const counts=new Map;data.forEach(x=>counts.set(x,(counts.get(x)||0)+1));g=chart(lo,hi,0,Math.max(...counts.values())+1,'Value','Frequency');s=g.s;for(const [x,c]of counts)for(let i=1;i<=c;i++)s+=point(g,x,i,C.teal,4)}svg(s,'Distribution of entered numerical data');formula(`${data.length} observations`);results([['Mean',fmt(S.mean)],['Median',fmt(S.median)],['Q₁ / Q₃',`${fmt(S.q1)} / ${fmt(S.q3)}`],['IQR',fmt(S.iqr)],['Population σ',fmt(S.sd)],['Sample s',fmt(S.sampleSD)]]);note('Quartiles use medians of the lower and upper halves, excluding the middle value for odd n. Box-plot whiskers reach the most extreme non-outliers; dots beyond 1.5 × IQR fences are outliers. For one value, both quartiles equal that value.');table(['Ordered value','Outlier'],S.a.map(x=>[x,S.outliers.includes(x)?'Yes':'No']));legend([['Data / box',C.purple],['Median',C.red],['Outliers',C.gold]])};}},
 distributions:{title:'Distribution Lab',tag:'APPLICATIONS · METHODS',subtitle:'Connect probability and area.',setup(){controls(select('dist','Distribution',[['binomial','Binomial'],['normal','Normal']])+pair(input('n','Trials n',10,1,100,1),input('p','Success probability p',.5,0,1,.01))+pair(input('mu','Mean μ',0,-1000,1000),input('sd','Standard deviation σ',1,.01,1000))+select('rule','Normal rule',[['custom','Custom bounds'],['1','Within 1σ ≈ 68%'],['2','Within 2σ ≈ 95%'],['3','Within 3σ ≈ 99.7%']])+select('event','Probability region',[['between','Between lower and upper (inclusive)'],['left','At most upper'],['right','At least lower']])+pair(input('lower','Lower bound',3,-10000,10000),input('upper','Upper bound',7,-10000,10000)));$('dist').onchange=()=>{$('lower').value=$('dist').value==='normal'?-1:3;$('upper').value=$('dist').value==='normal'?1:7;run()};update=()=>{const normal=$('dist').value==='normal';showControl('rule',normal);const rule=normal?Number($('rule').value):0;if(rule){$('event').value='between';$('lower').value=value('mu')-rule*value('sd');$('upper').value=value('mu')+rule*value('sd')}const event=$('event').value;showControl('event',!rule);for(const id of ['n','p'])$(id).disabled=normal;for(const id of ['mu','sd'])$(id).disabled=!normal;$('lower').disabled=event==='left'||!!rule;$('upper').disabled=event==='right'||!!rule;const l=event==='left'?-Infinity:value('lower'),u=event==='right'?Infinity:value('upper');if(l>u)throw Error('Lower bound must not exceed upper bound.');let probability,mean,sd,s,g;if(normal){mean=value('mu');sd=value('sd');g=chart(mean-4*sd,mean+4*sd,0,M.pdf(mean,mean,sd)*1.15,'x','Density');let pts=`${g.X(Math.max(g.xmin,l))},${g.Y(0)} `,low=Math.max(g.xmin,l),high=Math.min(g.xmax,u);s=g.s;if(low<high){for(let i=0;i<=300;i++){let x=low+(high-low)*i/300;pts+=`${g.X(x)},${g.Y(M.pdf(x,mean,sd))} `}pts+=`${g.X(high)},${g.Y(0)}`;s+=`<polygon points="${pts}" fill="${C.teal}" opacity=".35"/>`}s+=curve(g,x=>M.pdf(x,mean,sd));probability=(u===Infinity?1:M.normalCDF((u-mean)/sd))-(l===-Infinity?0:M.normalCDF((l-mean)/sd));formula(`X ~ N(${mean}, ${sd}²)`);table(['Bound','x','z'],[[event==='left'?'Lower tail':'Lower',l===-Infinity?'−∞':l,l===-Infinity?'−∞':fmt((l-mean)/sd)],['Upper',u===Infinity?'∞':u,u===Infinity?'∞':fmt((u-mean)/sd)]]);note('Shaded area represents probability, not curve height. The graph displays μ ± 4σ; tail probabilities include values beyond the visible window. Normal probabilities are numerical approximations.')}else{const n=value('n'),p=value('p'),pmf=M.binomial(n,p);mean=n*p;sd=Math.sqrt(n*p*(1-p));probability=pmf.reduce((sum,v,k)=>sum+(k>=l&&k<=u?v:0),0);g=chart(-.6,n+.6,0,Math.max(...pmf)*1.15,'Successes k','Probability',false,{x:Array.from({length:Math.floor(n/Math.max(1,Math.ceil(n/10)))+1},(_,i)=>i*Math.max(1,Math.ceil(n/10)))});s=g.s;pmf.forEach((v,k)=>{s+=`<rect x="${g.X(k-.38)}" y="${g.Y(v)}" width="${g.X(.38)-g.X(-.38)}" height="${g.Y(0)-g.Y(v)}" fill="${k>=l&&k<=u?C.teal:'#d7c6e8'}"/>`});formula(`X ~ Bin(${n}, ${p})`);table(['k','P(X = k)','Selected'],pmf.map((v,k)=>[k,v.toFixed(6),k>=l&&k<=u?'Yes':'No']));note('Binomial models count successes in a fixed number of independent trials with the same success probability. Bounds select integer outcomes; endpoints are included.')}svg(s,'Probability distribution with selected region highlighted');legend([['Selected probability',C.teal],['Distribution',C.purple]]);results([['Selected probability',fmt(Math.max(0,Math.min(1,probability)),6)],['Percentage',fmt(probability*100,3)+'%'],['Mean',fmt(mean)],['Standard deviation',fmt(sd)]])};}},
 trigonometry:{title:'Trigonometry Lab',tag:'YEARS 9–10 · METHODS',subtitle:'An angle, a circle, a triangle.',setup(){controls(select('mode','Model',[['circle','Unit circle'],['right','Right triangle'],['cosine','Cosine rule (SAS)']])+slider('angle','Angle θ (degrees)',35,-360,360,1)+pair(input('hyp','Hypotenuse',10,.1,1000),input('sideA','Side b',7,.1,1000))+input('sideB','Side c',9,.1,1000));$('mode').onchange=()=>{$('angle').min=$('mode').value==='circle'?-360:1;$('angle').max=$('mode').value==='circle'?360:$('mode').value==='right'?89:179;$('angle').value=35;$('angleval').textContent=35;run()};update=()=>{const mode=$('mode').value,t=value('angle'),r=t*Math.PI/180,co=Math.cos(r),si=Math.sin(r);$('hyp').disabled=mode!=='right';$('sideA').disabled=mode!=='cosine';$('sideB').disabled=mode!=='cosine';let s='',rows=[];if(mode==='circle'){const cx=420,cy=215,R=160,x=cx+co*R,y=cy-si*R;s=`<path d="M200 215H640 M420 20V410" stroke="#b7a7c3"/><circle cx="420" cy="215" r="160" fill="none" stroke="#d3c0e3" stroke-width="2"/><path d="M420 215L${x} 215L${x} ${y}Z" fill="#d6ede8" stroke="${C.teal}" stroke-width="2"/><path d="M420 215L${x} ${y}" stroke="${C.purple}" stroke-width="4"/><circle cx="${x}" cy="${y}" r="7" fill="${C.red}"/><text x="600" y="236" font-size="14">1</text><text x="436" y="54" font-size="14">1</text><text x="224" y="236" font-size="14">−1</text><text x="436" y="397" font-size="14">−1</text><text x="50" y="70" font-size="18" fill="${C.purple}">θ = ${t}°</text>`;results([['Radians',fmt(r)],['cos θ (x)',fmt(co)],['sin θ (y)',fmt(si)],['tan θ',Math.abs(co)<1e-10?'Undefined':fmt(si/co)]]);formula('P = (cos θ, sin θ)');rows=[['cos θ',co],['sin θ',si],['tan θ',Math.abs(co)<1e-10?'Undefined':si/co]];note('The radius is 1. Anticlockwise angles are positive. The horizontal and vertical coordinates give cosine and sine; tan θ is undefined when cos θ = 0.')}else if(mode==='right'){const H=value('hyp'),op=H*si,adj=H*co,scale=300/H,x=210+adj*scale,y=350-op*scale;s=`<pol  finance:{title:'Finance & Sequence Lab',tag:'YEARS 9–10 · APPLICATIONS',subtitle:'Small changes. Long-term patterns.',setup(){controls(select('kind','Model',[['compound','Compound growth / decay'],['simple','Simple interest'],['saving','Savings with deposits'],['loan','Reducing-balance loan'],['sequence','Arithmetic / geometric sequences']])+pair(input('principal','Initial amount / first term',1000,0,1e7),input('rate','Rate per period (%)',5,-99,100))+pair(input('periods','Periods / terms',20,1,600,1),input('payment','Deposit / repayment',100,0,1e6))+select('seq','Sequence type',[['arithmetic','Arithmetic'],['geometric','Geometric']])+input('change','Difference d / ratio r',2,-10,10));update=()=>{const kind=$('kind').value,p=value('principal'),n=value('periods');$('rate').disabled=kind==='sequence';$('payment').disabled=!['saving','loan'].includes(kind);$('seq').disabled=kind!=='sequence';$('change').disabled=kind!=='sequence';let rows,summary;if(kind==='sequence'){const d=value('change'),ar=$('seq').value==='arithmetic';rows=Array.from({length:n},(_,i)=>({period:i+1,balance:ar?p+i*d:p*d**i}));if(rows.some(x=>!Number.isFinite(x.balance)||Math.abs(x.balance)>1e15))throw Error('Values exceed the display range. Reduce the ratio or terms.');summary=[['Term '+n,fmt(rows.at(-1).balance)],['Sum of terms',fmt(M.sum(rows.map(x=>x.balance)))]];formula(ar?`tₙ = ${p} + (n − 1) × ${d}`:`tₙ = ${p} × (${d})ⁿ⁻¹`);note('Sequence terms are indexed from n = 1. Arithmetic sequences add a fixed difference; geometric sequences multiply by a fixed ratio.');table(['Term n','tₙ'],rows.map(r=>[r.period,fmt(r.balance,6)]))}else{const r=value('rate')/100,pay=value('payment'),F=M.finance(p,r,pay,n,kind);rows=F.rows;if(rows.some(x=>!Number.isFinite(x.balance)||Math.abs(x.balance)>1e15))throw Error('Balances exceed the display range. Reduce the rate or periods.');summary=[['Final balance','$'+fmt(F.balance,2)],['Interest total','$'+fmt(F.totalInterest,2)],['Periods modelled',rows.at(-1).period]];if(kind==='loan')summary.push(['Loan status',F.balance===0?'Paid off':pay<=p*r?'Repayment ≤ first interest':'Balance remains']);formula(kind==='simple'?`Bₙ = ${p}(1 + ${r}n)`:`Bₙ₊₁ = (1 + ${r})Bₙ ${kind==='loan'?'− repayment':kind==='saving'?'+ deposit':''}`);note('Rates are per period. Deposits and repayments occur at the end of each period, after interest. Loan repayments are capped at the amount owing. Calculations keep full precision; displayed currency rounds to cents. This is a classroom model without fees.');table(['Period','Balance','Interest','Deposit / repayment'],rows.map(r=>[r.period,fmt(r.balance,2),fmt(r.interest,2),fmt(r.payment,2)]))}const g=chart(0,Math.max(1,rows.at(-1).period),...padded([0,...rows.map(r=>r.balance)]),'Period / term','Value');let s=g.s;for(let i=1;i<rows.length;i++)s+=line(g,[rows[i-1].period,rows[i-1].balance],[rows[i].period,rows[i].balance],C.purple);if(rows.length<80)s+=rows.map(r=>point(g,r.period,r.balance,C.teal,3)).join('');svg(s,'Growth or sequence plot');results(summary);legend([['Value',C.purple]])};}},
 vectors:{title:'Vector & Matrix Lab',tag:'YEARS 10–12 · SPECIALIST',subtitle:'Move, combine and transform.',setup(){controls(select('mode','Investigation',[['vectors','Two-dimensional vectors'],['matrix','2 × 2 matrix transformation']])+pair(input('ax','aₓ',3,-20,20),input('ay','aᵧ',2,-20,20))+pair(input('bx','bₓ',-1,-20,20),input('by','bᵧ',3,-20,20))+slider('scalar','Scalar λ',1,-4,4)+select('op','Vector operation',[['add','a + b'],['subtract','a − b'],['scale','λa'],['projection','Projection of a onto b']])+`<div class="wide muted section">Matrix entries: [ m₁₁ m₁₂ ; m₂₁ m₂₂ ]</div>`+pair(input('m11','m₁₁',1,-5,5),input('m12','m₁₂',1,-5,5))+pair(input('m21','m₂₁',0,-5,5),input('m22','m₂₂',1,-5,5)));update=()=>{const matrix=$('mode').value==='matrix',a=[value('ax'),value('ay')],b=[value('bx'),value('by')];for(const id of ['bx','by','scalar','op'])$(id).disabled=matrix;for(const id of ['m11','m12','m21','m22'])$(id).disabled=!matrix;let v,items,segments=[],extra=[],g;if(matrix){const A=[value('m11'),value('m12'),value('m21'),value('m22')],T=([x,y])=>[A[0]*x+A[1]*y,A[2]*x+A[3]*y],det=A[0]*A[3]-A[1]*A[2],square=[[0,0],[1,0],[1,1],[0,1]];v=T(a);const points=[...square,...square.map(T),a,v];g=chart(...padded(points.map(p=>p[0])),...padded(points.map(p=>p[1])),'x','y',true);for(let i=0;i<4;i++){segments.push(line(g,square[i],square[(i+1)%4],'#bba7cd'));segments.push(line(g,T(square[i]),T(square[(i+1)%4]),C.teal))}extra.push(`<polygon clip-path="url(#plotclip)" points="${square.map(p=>T(p)).map(p=>`${g.X(p[0])},${g.Y(p[1])}`).join(' ')}" fill="${C.teal}" opacity=".15"/>`);items=[['Transformed a',`(${fmt(v[0])}, ${fmt(v[1])})`],['Determinant',fmt(det)],['Area scale',fmt(Math.abs(det))],['Orientation',det===0?'Collapsed':det<0?'Reversed':'Preserved']];formula(`T(x, y) = (${A[0]}x + ${A[1]}y, ${A[2]}x + ${A[3]}y)`);note('The unit square becomes a parallelogram. |det M| is its area; a negative determinant reverses orientation and determinant 0 collapses area.');table(['Point','Original x','Original y','Image x','Image y'],square.map((p,i)=>[i+1,...p,...T(p)]));legend([['Original a',C.purple],['Image / transformed square',C.teal]])}else{const op=$('op').value,ab=M.dot(a,b),na=M.norm(a),nb=M.norm(b);if(op==='projection'&&nb===0)throw Error('Projection onto the zero vector is undefined.');v=op==='add'?a.map((x,i)=>x+b[i]):op==='subtract'?a.map((x,i)=>x-b[i]):op==='scale'?a.map(x=>x*value('scalar')):b.map(x=>x*ab/(nb*nb));const points=[[0,0],a,b,v];g=chart(...padded(points.map(p=>p[0])),...padded(points.map(p=>p[1])),'x','y',true);segments.push(line(g,[0,0],b,C.blue));if(op==='add')segments.push(line(g,a,v,C.blue,'5 4'),line(g,b,v,C.purple,'5 4'));items=[['Result',`(${fmt(v[0])}, ${fmt(v[1])})`],['a · b',fmt(ab)],['|a| / |b|',`${fmt(na)} / ${fmt(nb)}`],['Angle',na*nb===0?'Undefined':fmt(Math.acos(Math.max(-1,Math.min(1,ab/(na*nb))))*180/Math.PI)+'°']];formula({add:'a + b',subtract:'a − b',scale:'λa',projection:'projᵦ a = [(a · b) / |b|²] b'}[op]);note('Vectors start at the origin. Dashed lines show tip-to-tail addition. The angle is undefined if either vector is zero. Projection uses the direction of b.');table(['Vector','x','y','Magnitude'],[['a',...a,fmt(na)],['b',...b,fmt(nb)],['Result',...v.map(x=>fmt(x)),fmt(M.norm(v))]]);legend([['a',C.purple],['b',C.blue],['Result',C.teal]])}let s=g.s+extra.join('')+segments.join('')+line(g,[0,0],a,C.purple)+line(g,[0,0],v,C.teal)+point(g,...a,C.purple)+point(g,...v,C.teal);svg(s,'Vectors or matrix transformation on equal-scale coordinate axes');results(items)};}},
 complex:{title:'Complex Number Lab',tag:'SPECIALIST',subtitle:'Algebra on the Argand plane.',setup(){controls(pair(input('re','Real part of z',2,-10,10),input('im','Imaginary part of z',1,-10,10))+pair(input('wr','Real part of w',1,-10,10),input('wi','Imaginary part of w',1,-10,10))+select('operation','Operation',[['add','z + w'],['multiply','z × w'],['divide','z ÷ w'],['power','zⁿ'],['roots','nth roots of z']])+input('power','Power / root n',3,1,12,1));update=()=>{const z=[value('re'),value('im')],w=[value('wr'),value('wi')],op=$('operation').value,n=value('power'),isRoots=op==='roots';$('power').disabled=!['power','roots'].includes(op);$('wr').disabled=$('wi').disabled=['power','roots'].includes(op);let out=isRoots?M.roots(z,n):[M.complex(z,w,op,n)],all=[[0,0],z,...(['add','subtract','multiply','divide'].includes(op)?[w]:[]),...out];if(all.some(p=>M.norm(p)>1e12))throw Error('Result is too large to display. Reduce the power.');const g=chart(...padded(all.map(p=>p[0])),...padded(all.map(p=>p[1])),'Real','Imaginary',true);let s=g.s+line(g,[0,0],z,C.purple)+point(g,...z,C.purple);if(['add','subtract','multiply','divide'].includes(op))s+=line(g,[0,0],w,C.blue)+point(g,...w,C.blue);out.forEach((p,i)=>{s+=line(g,[0,0],p,C.teal)+point(g,...p,C.teal);if(isRoots)s+=`<text x="${g.X(p[0])+8}" y="${g.Y(p[1])-8}" font-size="12" fill="${C.teal}">k=${i}</text>`});const complexText=p=>`${fmt(p[0])} ${p[1]<0?'−':'+'} ${fmt(Math.abs(p[1]))}i`,r=M.norm(z),theta=r===0?null:Math.atan2(z[1],z[0]);formula(isRoots?'Roots: r¹⁄ⁿ cis((θ + 2kπ) / n)':'z = r(cos θ + i sin θ)');results([['|z|',fmt(r)],['arg z (radians)',fmt(theta)],['arg z (degrees)',theta===null?'Undefined':fmt(theta*180/Math.PI)+'°'],[isRoots?'Distinct roots':'Result',isRoots?(r===0?1:n):complexText(out[0])]]);svg(s,'Argand diagram of complex values and results');legend([['z',C.purple],['w',C.blue],['Result / roots',C.teal]]);note('Principal arguments use −π < θ ≤ π. Multiplication multiplies moduli and adds arguments. For  arrays:{title:'Probability Array Lab',tag:'YEARS 7–10',subtitle:'Every possible pair, in one place.',setup(){controls(select('arrayMode','Experiment',[['dice','Two dice: investigate sums'],['custom','Two sets of choices']])+pair(select('facesA','Faces on die A',[[4,'4'],[6,'6'],[8,'8'],[10,'10'],[12,'12'],[20,'20']]),select('facesB','Faces on die B',[[4,'4'],[6,'6'],[8,'8'],[10,'10'],[12,'12'],[20,'20']]))+`<div class="wide"><label for="choicesA">Choices in set A (comma separated)</label><input id="choicesA" value="Shorts, Pants"><label for="choicesB">Choices in set B (comma separated)</label><input id="choicesB" value="Shirt, Jumper, Jacket"></div>`+select('condition','Highlight sums',[['equal','Equal to target'],['atleast','At least target'],['atmost','At most target'],['even','Even'],['odd','Odd']])+input('target','Target sum',7,0,40,1));$('facesA').value=$('facesB').value='6';let selected=new Set,lastKey='';update=()=>{const dice=$('arrayMode').value==='dice';for(const id of ['choicesA','choicesB'])$(id).disabled=dice;for(const id of ['facesA','facesB','condition','target'])$(id).disabled=!dice;const split=s=>s.split(',').map(x=>x.trim()).filter(Boolean);const a=dice?Array.from({length:Number($('facesA').value)},(_,i)=>i+1):split($('choicesA').value),b=dice?Array.from({length:Number($('facesB').value)},(_,i)=>i+1):split($('choicesB').value);if(!a.length||!b.length||a.length>20||b.length>20||[...a,...b].some(x=>String(x).length>20))throw Error('Use 1–20 choices per set, with labels up to 20 characters.');const key=JSON.stringify([a,b,dice]);if(key!==lastKey){selected=new Set;lastKey=key}const target=value('target'),cond=$('condition').value,pick=(i,j)=>dice?(cond==='equal'?a[i]+b[j]===target:cond==='atleast'?a[i]+b[j]>=target:cond==='atmost'?a[i]+b[j]<=target:cond==='even'?(a[i]+b[j])%2===0:(a[i]+b[j])%2!==0):selected.has(i+':'+j);let count=0,s='',rows=[],w=dice?720/b.length:Math.max(210,720/b.length),h=dice?340/a.length:Math.max(46,340/a.length);for(let j=0;j<b  ratios:{title:'Ratio & Rate Lab',tag:'YEARS 7–10',subtitle:'Compare quantities on the same basis.',setup(){controls(select('mode','Investigation',[['ratio','Share in a ratio'],['speed','Distance, speed and time'],['value','Compare unit prices']])+pair(input('ra','Ratio part A',2,1,100,1),input('rb','Ratio part B',3,1,100,1))+input('total','Total to share',100,.01,1e6)+pair(input('distance','Distance (km)',120,.01,1e6),input('time','Time (minutes)',90,.01,1e6))+pair(input('costA','Cost A ($)',6,.01,1e6),input('qtyA','Quantity A',500,.01,1e6))+pair(input('costB','Cost B ($)',9,.01,1e6),input('qtyB','Quantity B',800,.01,1e6)));update=()=>{const mode=$('mode').value;for(const id of ['ra','rb','total'])$(id).disabled=mode!=='ratio';for(const id of ['distance','time'])$(id).disabled=mode!=='speed';for(const id of ['costA','qtyA','costB','qtyB'])$(id).disabled=mode!=='value';let s='';if(mode==='ratio'){const a=value('ra'),b=value('rb'),total=value('total'),one=total/(a+b),A=one*a,B=one*b;s=`<rect x="65" y="130" width="${710*a/(a+b)}" height="100" rx="5" fill="${C.purple}"/><rect x="${65+710*a/(a+b)}" y="130" width="${710*b/(a+b)}" height="100" rx="5" fill="${C.teal}"/><text x="220" y="280" text-anchor="middle" fill="${C.purple}" font-size="20">A: ${a} parts</text><text x="620" y="280" text-anchor="middle" fill="${C.teal}" font-size="20">B: ${b} parts</text>`;if(a+b<=40)for(let i=1;i<a+b;i++)s+=`<path d="M${65+710*i/(a+b)} 130v100" stroke="white"/>`;formula(`A : B = ${a} : ${b}`);results([['One part',fmt(one)],['Share A',fmt(A)],['Share B',fmt(B)],['A + B',fmt(A+B)]]);note('The total is divided into a + b equal parts. Multiply the value of one part by each ratio number. Labels keep the original ratio; the bar shows its proportions.');table(['Quantity','Value'],[['One part',one],['A',A],['B',B]])}else if(mode==='speed'){const d=value('distance'),t=value('time'),speed=d/(t/60),g=chart(0,t,0,d,'Time (minutes)','Distance (km)');s=g.s+line(g,[0,0],[t,d],C.purple);formula('Avera  if(mode==='value'){const unit=$('priceUnit').value,per=unit==='item'?1:100,ids=$('third').checked?['A','B','C']:['A','B'],prices=ids.map(id=>({id,cost:value('cost'+id),qty:value('qty'+id)})).map(o=>({...o,price:o.cost/o.qty*per})),max=Math.max(...prices.map(o=>o.price)),raw=max/6,mag=10**Math.floor(Math.log10(raw)),ratio=raw/mag,step=(ratio<=1?1:ratio<=2?2:ratio<=5?5:10)*mag,top=Math.ceil(max*1.15/step)*step,g=chart(0,top,0,ids.length,'Cost ($) per '+per+' '+(unit==='item'?'item':unit),'',false,{x:Array.from({length:Math.round(top/step)+1},(_,i)=>i*step),y:[]});let s=g.s;prices.forEach((o,i)=>{const y=g.Y(ids.length-i-.5),col=[C.purple,C.teal,C.blue][i];s+=`<rect x="${g.X(0)}" y="${y-32}" width="${g.X(o.price)-g.X(0)}" height="64" fill="${col}" opacity=".8"><title>Option ${o.id}: $${o.price.toFixed(4)} per ${per} ${unit}</title></rect><text x="50" y="${y+4}" text-anchor="end" font-size="15">${o.id}</text>`;if($('reveal').checked)s+=`<text x="${g.X(o.price)+8}" y="${y+4}" font-size="13">$${o.price.toFixed(2)}</text>`});svg(s,'Unit price comparison with a shared dollar scale starting at zero');const min=Math.min(...prices.map(o=>o.price)),best=prices.filter(o=>Math.abs(o.price-min)<1e-9).map(o=>o.id);results([...prices.map(o=>['Option '+o.id+' per '+per+' '+unit,'$'+o.price.toFixed(2)]),['Best unit price',best.join(' & ')]]);formula('Compare the same quantity · lower unit price is better value');legend(prices.map((o,i)=>['Option '+o.id,[C.purple,C.teal,C.blue][i]]));note('Enter quantities in the selected common unit. The horizontal dollar scale starts at zero. Compare unrounded unit prices; displayed prices round to cents.');table(['Option','Pack price ($)','Quantity ('+unit+')','Cost per '+per+' '+unit],prices.map(o=>[o.id,o.cost,o.qty,o.price]));
 }else{const D=value('distance'),vA=value('speedA'),vB=value('speedB'),extras=$('journeyExtras').checked,delay=extras?value('delayB'):0,stop=extras?value('stopA'):0,half=D/vA*30,tA=D/vA*60+stop,tB=delay+D/vB*60,end=Math.max(tA,tB),positionA=t=>t<=half?Math.min(D,t*vA/60):t<=half+stop?D/2:Math.min(D,(t-stop)*vA/60),positionB=t=>Math.max(0,Math.min(D,(t-delay)*vB/60));$('elapsed').max=end;$('elapsed').step=Math.max(.01,end/500);if(Number($('elapsed').value)>end)$('elapsed').value=end;const t=value('elapsed');$('elapsedval').textContent=fmt(t,1);const g=chart(0,end*1.05,0,D*1.08,'Elapsed time (minutes)','Distance (km)');let s=g.s;const path=(times,f,col)=>{let out='';for(let i=1;i<times.length;i++)out+=line(g,[times[i-1],f(times[i-1])],[times[i],f(times[i])],col);return out};s+=path([0,half,half+stop,tA,end],positionA,C.purple)+path([0,delay,tB,end],positionB,C.teal)+line(g,[t,0],[t,D],C.gold,'5 4')+point(g,t,positionA(t),C.purple,7)+point(g,t,positionB(t),C.teal,7);svg(s,'Compare journey gradients, delayed starts and stops; scrub time to track positions');formula('Which journey finishes first? Move the time slider to investigate.');results([['A finishes',fmt(tA,2)+' min'],['B finishes',fmt(tB,2)+' min'],['Arrival difference',fmt(Math.abs(tA-tB),2)+' min'],['First to finish',Math.abs(tA-tB)<1e-8?'Together':tA<tB?'A':'B'],['A at current time',fmt(positionA(t),2)+' km'],['B at current time',fmt(positionB(t),2)+' km']]);legend([['Journey A',C.purple],['Journey B',C.teal],['Current time',C.gold]]);note('Both travel the same distance. Steeper sections mean faster travel; horizontal sections mean waiting. Optional settings delay B’s start and stop A halfway. Hide calculated results to predict the winner from the graph.');table(['Journey','Distance (km)','Moving speed (km/h)','Waiting time (min)','Finish time (min)'],[['A',D,vA,stop,tA],['B',D,vB,delay,tB]]);
 }};
};
