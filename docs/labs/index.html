<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive mathematics labs for secondary school: functions, statistics, distributions, trigonometry, finance, vectors, complex numbers and networks."><title>Maths Labs · Mr Day’s Maths Tools</title><style>*{box-sizing:border-box}body{margin:0;color:#3e2d4e;background:#26143e radial-gradient(#b79ad31c 1px,transparent 1px);background-size:20px 20px;font:15px/1.5 system-ui,sans-serif}header,main{max-width:1600px;margin:auto;padding:16px 25px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #ffffff20;color:#fff}.brand{font-size:20px;font-weight:750}a{color:#dac4ed;text-decoration:none}header a{font-size:12px}h1{color:#fff;font-size:29px;letter-spacing:-1px;margin:2px 0 14px}h2{font-size:16px;margin:0 0 12px}h3{font-size:13px;margin:15px 0 8px}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#c9aee1;font-weight:750}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}.panel{background:#fcf9ff;border:1px solid #e5d9ed;border-radius:18px;box-shadow:0 12px 28px #13082135}.controls{padding:18px;max-height:calc(100dvh - 255px);overflow:auto}.section{border-top:1px solid #e7deed;padding-top:13px;margin-top:14px}label{display:block;font-size:12px;color:#725a82;font-weight:650;margin:10px 0 5px}input,select,textarea,button{font:inherit;border:1px solid #d9c9e4;color:#443150;background:white;border-radius:8px;padding:8px 10px;min-width:0}input:not([type=checkbox]):not([type=range]),select,textarea{width:100%}textarea{resize:vertical;font-size:13px;min-height:100px}input[type=range]{width:100%;padding:0;accent-color:#8252b5}input[type=checkbox]{accent-color:#8252b5}button{cursor:pointer;font-size:12px;font-weight:650}button:hover{background:#eee2f9}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid g:15px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.controls>h2,.controls>.section,.controls>.actions,.controls>.error,.controls>.wide{grid-column:1/-1}.section{margin-top:0}.results{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.controls{display:block}.viz{height:300px}.brand{font-size:16px}.stage{padding:12px}h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><div id="brand" class="brand">Maths Labs</div><a href="../">← All maths tools</a></header><main><div class="eyebrow" id="tag"></div><h1 id="subtitle"></h1><div class="layout"><aside><div class="panel" style="padding:12px 18px;margin-bottom:12px"><label for="activity" style="margin-top:0">Activity</label><select id="activity"></select></div><div class="panel controls" id="controls"></div></aside><section class="panel stage"><div class="bar"><h2 id="title"></h2><span class="chip">EXPLORE · PREDICT · REVEAL</span></div><div id="formula" class="formula"></div><div id="legend" class="legend"></div><div id="viz" class="viz"></div><div id="results" class="results" aria-live="polite"></div><div id="note" class="note"></div><details style="margin-top:14px"><summary style="font-size:12px;color:#765f87;cursor:pointer">Data table</summary><div id="table" class="tablewrap"></div></details></section></div><div class="footer">Mr Day’s Maths Tools · Silent, browser-based exploration</div></main><script src="maths.js"></script><script>const $=id=>document.getElementById(id),M=Maths,C={purple:'#8050b4',teal:'#078477',red:'#d24452',blue:'#287caf',gold:'#b57618'},fmt=(x,d=3)=>x===null||!Number.isFinite(x)?'—':Number(x.toFixed(d)).toLocaleString('en-AU',{maximumFractionDigits:d}),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current='',update=()=>{},exportRows=[];
function input(id,label,value,min=-100,max=100,step='any'){return `<div><label for="${id}">${label}</label><input id="${id}" type="number" value="${value}" min="${min}" max="${max}" step="${step}"></div>`}
function slider(id,label,value,min,max,step=.1){return `<div><label for="${id}">${label} <output id="${id}val">${value}</output></label><input id="${id}" type="range" value="${value}" min="${min}" max="${max}" step="${step}"></div>`}
function select(id,label,options){return `<div><label for="${id}">${label}</label><select id="${id}">${options.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div>`}
function check(id,label,checked=false){return `<label class="check"><input id="${id}" type="checkbox" ${checked?'checked':''}>${label}</label>`}
const pair=(a,b)=>`<div class="pair wide">${a}${b}</div>`;
function value(id){const el=$(id),v=Number(el.value);if(el.value.trim()===''||!Number.isFinite(v)||v<Number(el.min)||v>Number(el.max)||(el.step==='1'&&!Number.isInteger(v)))throw Error('Check '+(document.querySelector(`label[for="${id}"]`)?.textContent||id)+'.');return v}
function controls(html){$('controls').innerHTML=html+`<section class="section">${check('reveal','Show calculated results',true)}<div class="actions"><button id="reset">Reset activity</button><button id="csv">Export table</button></div><div id="error" class="error" role="alert"></div></section>`;$('reset').onclick=()=>launch(current);$('csv').onclick=()=>{if(!exportRows.length)return;download(exportRows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),current+'-results.csv','text/csv')};$('controls').oninput=e=>{if(e.target.type==='range')$(e.target.id+'val').textContent=e.target.value;run()};$('controls').onchange=run}
function run(){try{exportRows=[];update();$('error').textContent='';$('results').hidden=!$('reveal').checked;$('table').hidden=!$('reveal').checked;$('csv').disabled=!$('reveal').checked||!exportRows.length}catch(e){$('error').textContent=e.message;$('results').innerHTML='';$('table').innerHTML='';$('viz').innerHTML='';$('formula').textContent='';$('csv').disabled=true}}
function results(items){$('results').innerHTML=items.map(([label,v])=>`<div class="stat"><small>${esc(label)}</small><strong>${esc(v)}</strong></div>`).join('')}
function note(s){$('note').textContent=s}function formula(s){$('formula').textContent=s}
function table(headers,rows){exportRows=[headers,...rows];$('table').innerHTML=`<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function download(s,name,type){const u=URL.createObjectURL(new Blob([s],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function svg(content,label){$('viz').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-label="${esc(label)}"><defs><clipPath id="plotclip"><rect x="60" y="25" width="750" height="365"/></clipPath><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="context-stroke"/></marker></defs>${content}</svg>`}
function chart(xmin,xmax,ymin,ymax,xlabel='x',ylabel='y',equal=false){if(xmin===xmax){xmin--;xmax++}if(ymin===ymax){ymin--;ymax++}if(equal){const dy=(xmax-xmin)*365/750;if(dy>ymax-ymin){const mid=(ymin+ymax)/2;ymin=mid-dy/2;ymax=mid+dy/2}else{const dx=(ymax-ymin)*750/365,mid=(xmin+xmax)/2;xmin=mid-dx/2;xmax=mid+dx/2}}const X=x=>60+(x-xmin)/(xmax-xmin)*750,Y=y=>390-(y-ymin)/(ymax-ymin)*365;let s='';for(let i=0;i<=5;i++){const x=xmin+(xmax-xmin)*i/5,y=ymin+(ymax-ymin)*i/5;s+=`<path d="M${X(x)} 25V390 M60 ${Y(y)}H810" stroke="#e5deec"/><text x="${X(x)}" y="410" text-anchor="middle" font-size="11" fill="#806b91">${fmt(x,2)}</text><text x="51" y="${Y(y)+4}" text-anchor="end" font-size="11" fill="#806b91">${fmt(y,2)}</text>`}s+=`<path d="M60 ${Y(Math.max(ymin,Math.min(ymax,0)))}H810 M${X(Math.max(xmin,Math.min(xmax,0)))} 25V390" stroke="#9d86ad"/><text x="435" y="435" text-anchor="middle" font-size="12" fill="#6e537e">${esc(xlabel)}</text><text transform="translate(15 210) rotate(-90)" text-anchor="middle" font-size="12" fill="#6e537e">${esc(ylabel)}</text>`;return{X,Y,s,xmin,xmax,ymin,ymax}}
function curve(g,f,color=C.purple){let d='',pen=false;for(let i=0;i<=700;i++){const x=g.xmin+(g.xmax-g.xmin)*i/700,y=f(x);if(Number.isFinite(y)&&Math.abs(g.Y(y))<10000){d+=(pen?'L':'M')+g.X(x)+','+g.Y(y);pen=true}else pen=false}return `<path clip-path="url(#plotclip)" d="${d}" fill="none" stroke="${color}" stroke-width="3"/>`}
const line=(g,a,b,color=C.teal,dash='')=>`<path clip-path="url(#plotclip)" d="M${g.X(a[0])} ${g.Y(a[1])}L${g.X(b[0])} ${g.Y(b[1])}" fill="none" stroke="${color}" stroke-width="2.5" ${dash?'stroke-dasharray="'+dash+'"':''}/>`;
const point=(g,x,y,color=C.red,r=5)=>`<circle clip-path="url(#plotclip)" cx="${g.X(x)}" cy="${g.Y(y)}" r="${r}" fill="${color}"/>`;
function legend(items){$('legend').innerHTML=items.map(([t,c])=>`<span><i class="dot" style="background:${c}"></i>${esc(t)}</span>`).join('')}
function padded(a){let lo=Math.min(...a),hi=Math.max(...a),pad=(hi-lo)*.12||1;return [lo-pad,hi+pad]}
const labs={
 functions:{title:'Function Lab',tag:'YEARS 8–10 · METHODS',subtitle:'Change the rule. Watch the graph.',setup(){controls(select('type','Function family',[['linear','Linear'],['quadratic','Quadratic'],['cubic','Cubic'],['sine','Sine (radians)'],['exponential','Exponential eˣ']])+slider('a','Vertical scale a',1,-4,4)+slider('b','Horizontal factor b',1,-3,3)+slider('h','Horizontal shift h',0,-5,5)+slider('k','Vertical shift k',0,-5,5)+pair(input('range','View ±',8,2,30),input('at','Point x₀',1,-30,30))+check('tangent','Show tangent')+check('integral','Shade signed integral')+pair(input('lo','Lower limit',0,-30,30),input('hi','Upper limit',2,-30,30)));update=()=>{const type=$('type').value,a=value('a'),b=value('b'),h=value('h'),k=value('k'),r=value('range'),at=value('at'),lo=value('lo'),hi=value('hi'),F=M.family(type,a,b,h,k);if(lo>hi)throw Error('Lower limit must not exceed upper limit.');const rule={linear:'u',quadratic:'u²',cubic:'u³',sine:'sin(u)',exponential:'eᵘ'}[type];formula(`y = ${a} × ${rule} + ${k}, where u = ${b}(x − ${h})`);const g=chart(-r,r,-r,r,'x','y'),d=F.d(at),y=F.f(at);let s=g.s;if($('integral').checked){let pts=`${g.X(lo)},${g.Y(0)} `;for(let i=0;i<=240;i++){const x=lo+(hi-lo)*i/240;pts+=`${g.X(x)},${g.Y(F.f(x))} `}pts+=`${g.X(hi)},${g.Y(0)}`;s+=`<polygon points="${pts}" fill="${C.teal}" opacity=".15" clip-path="url(#plotclip)"/>`}s+=curve(g,F.f);if($('tangent').checked){s+=curve(g,x=>y+d*(x-at),C.gold)+point(g,at,y)}svg(s,'Function graph with optional tangent and signed integral');legend([['Function',C.purple],['Tangent',C.gold],['Integral region',C.teal]]);results([['f(x₀)',fmt(y)],['Gradient f′(x₀)',fmt(d)],['Signed integral',fmt(F.integral(lo,hi))]]);note('Sliders update the graph immediately. Sine uses radians. The shaded integral is signed: area below the x-axis contributes negatively. A flat graph occurs when a or b is zero.');table(['x','f(x)'],Array.from({length:9},(_,i)=>{const x=-r+i*r/4;return[fmt(x),fmt(F.f(x))]}))};}},
 statistics:{title:'Statistics Lab',tag:'YEARS 7–10 · APPLICATIONS',subtitle:'See the story in the data.',setup(){controls(select('mode','Investigation',[['one','One-variable data'],['two','Scatterplot and regression']])+`<div class="wide"><label for="data">Data (commas or spaces; pairs on separate lines)</label><textarea id="data" rows="5">4, 5, 5, 6, 7, 7, 8, 9, 10, 12, 18</textarea></div>`+select('display','One-variable display',[['box','Box plot'],['hist','Histogram'],['dots','Dot plot']])+input('bins','Histogram bins',6,2,20,1)+check('fitline','Show regression line',true));$('mode').onchange=()=>{$('data').value=$('mode').value==='one'?'4, 5, 5, 6, 7, 7, 8, 9, 10, 12, 18':'1, 2\n2, 4\n3, 3\n4, 6\n5, 8\n6, 8';run()};update=()=>{const two=$('mode').value==='two';$('display').disabled=two;$('bins').disabled=two;$('fitline').disabled=!two;const raw=$('data').value.trim();if(!raw)throw Error('Enter data to begin.');if(two){const p=raw.split(/\n|;/).filter(x=>x.trim()).map(row=>row.trim().split(/[ ,\t]+/).map(Number));if(p.length>300||p.some(r=>r.length!==2||r.some(x=>!Number.isFinite(x)||Math.abs(x)>1e6)))throw Error('Enter up to 300 x,y pairs, one pair per line (values within ±1,000,000).');const R=M.regression(p),g=chart(...padded(p.map(p=>p[0])),...padded(p.map(p=>p[1])));let s=g.s+p.map(([x,y])=>point(g,x,y,C.purple)).join('');if($('fitline').checked)s+=curve(g,x=>R.m*x+R.c,C.teal);svg(s,'Scatterplot and optional least-squares regression line');formula($('reveal').checked?`ŷ = ${fmt(R.m)}x ${R.c<0?'−':'+'} ${fmt(Math.abs(R.c))}`:'Predict the relationship before revealing the results.');results([['Pairs',p.length],['Correlation r',fmt(R.r)],['r²',R.r===null?'—':fmt(R.r**2)],['Gradient',fmt(R.m)]]);note('Least-squares regression predicts y from x. Correlation describes linear association; it does not establish causation. A constant y gives undefined r.');table(['x','y','Predicted y','Residual'],p.map(([x,y])=>[x,y,fmt(R.m*x+R.c),fmt(y-R.m*x-R.c)]));legend([['Data',C.purple],['Regression',C.teal]]);return}const data=raw.split(/[\s,;]+/).map(Number);if(data.length>500||data.some(x=>!Number.isFinite(x)||Math.abs(x)>1e6))throw Error('Enter up to 500 finite values within ±1,000,000.');const S=M.stats(data),[lo,hi]=padded(data),mode=$('display').value;let g=chart(lo,hi,0,5,'Value',mode==='box'?'':'Frequency'),s='';if(mode==='box'){s=`<path d="M60 350H810" stroke="#b6a0c5"/>`;for(let i=0;i<=5;i++){const v=lo+(hi-lo)*i/5;s+=`<path d="M${g.X(v)} 345v10" stroke="#b6a0c5"/><text x="${g.X(v)}" y="376" text-anchor="middle" font-size="12" fill="#806b91">${fmt(v,2)}</text>`}const good=S.a.filter(x=>!S.outliers.includes(x)),low=good[0],high=good.at(-1),Y=205;s+=`<path d="M${g.X(low)} ${Y}H${g.X(high)} M${g.X(low)} ${Y-22}V${Y+22} M${g.X(high)} ${Y-22}V${Y+22}" stroke="${C.purple}" stroke-width="3"/><rect x="${g.X(S.q1)}" y="${Y-42}" width="${Math.max(1,g.X(S.q3)-g.X(S.q1))}" height="84" fill="#e4d4f2" stroke="${C.purple}" stroke-width="2"/><path d="M${g.X(S.median)} ${Y-42}V${Y+42}" stroke="${C.red}" stroke-width="3"/>`;s+=S.outliers.map(x=>`<circle cx="${g.X(x)}" cy="${Y}" r="5" fill="${C.gold}"/>`).join('');if($('reveal').checked)for(const [x,l] of [[S.q1,'Q₁'],[S.median,'Median'],[S.q3,'Q₃']])s+=`<text x="${g.X(x)}" y="140" text-anchor="middle" font-size="12" fill="#765487">${l}: ${fmt(x)}</text>`}else if(mode==='hist'){const n=value('bins'),min=S.min,max=S.max===S.min?S.min+1:S.max,w=(max-min)/n,counts=Array(n).fill(0);data.forEach(x=>counts[Math.min(n-1,Math.floor((x-min)/w))]++);g=chart(min,max,0,Math.max(...counts)*1.15,'Value','Frequency');s=g.s;counts.forEach((c,i)=>s+=`<rect x="${g.X(min+i*w)}" y="${g.Y(c)}" width="${750/n}" height="${g.Y(0)-g.Y(c)}" fill="${C.purple}" opacity=".7" stroke="white"/>`)}else{const counts=new Map;data.forEach(x=>counts.set(x,(counts.get(x)||0)+1));g=chart(lo,hi,0,Math.max(...counts.values())+1,'Value','Frequency');s=g.s;for(const [x,c]of counts)for(let i=1;i<=c;i++)s+=point(g,x,i,C.teal,4)}svg(s,'Distribution of entered numerical data');formula(`${data.length} observations`);results([['Mean',fmt(S.mean)],['Median',fmt(S.median)],['Q₁ / Q₃',`${fmt(S.q1)} / ${fmt(S.q3)}`],['IQR',fmt(S.iqr)],['Population σ',fmt(S.sd)],['Sample s',fmt(S.sampleSD)]]);note('Quartiles use medians of the lower and upper halves, excluding the middle value for odd n. Box-plot whiskers reach the most extreme non-outliers; dots beyond 1.5 × IQR fences are outliers. For one value, both quartiles equal that value.');table(['Ordered value','Outlier'],S.a.map(x=>[x,S.outliers.includes(x)?'Yes':'No']));legend([['Data / box',C.purple],['Median',C.red],['Outliers',C.gold]])};}},
 distributions:{title:'Distribution Lab',tag:'APPLICATIONS · METHODS',subtitle:'Connect probability and area.',setup(){controls(select('dist','Distribution',[['binomial','Binomial'],['normal','Normal']])+pair(input('n','Trials n',10,1,100,1),input('p','Success probability p',.5,0,1,.01))+pair(input('mu','Mean μ',0,-1000,1000),input('sd','Standard deviation σ',1,.01,1000))+select('event','Probability region',[['between','Between lower and upper (inclusive)'],['left','At most upper'],['right','At least lower']])+pair(input('lower','Lower bound',3,-10000,10000),input('upper','Upper bound',7,-10000,10000)));$('dist').onchange=()=>{$('lower').value=$('dist').value==='normal'?-1:3;$('upper').value=$('dist').value==='normal'?1:7;run()};update=()=>{const normal=$('dist').value==='normal',event=$('event').value;for(const id of ['n','p'])$(id).disabled=normal;for(const id of ['mu','sd'])$(id).disabled=!normal;$('lower').disabled=event==='left';$('upper').disabled=event==='right';const l=event==='left'?-Infinity:value('lower'),u=event==='right'?Infinity:value('upper');if(l>u)throw Error('Lower bound must not exceed upper bound.');let probability,mean,sd,s,g;if(normal){mean=value('mu');sd=value('sd');g=chart(mean-4*sd,mean+4*sd,0,M.pdf(mean,mean,sd)*1.15,'x','Density');let pts=`${g.X(Math.max(g.xmin,l))},${g.Y(0)} `,low=Math.max(g.xmin,l),high=Math.min(g.xmax,u);s=g.s;if(low<high){for(let i=0;i<=300;i++){let x=low+(high-low)*i/300;pts+=`${g.X(x)},${g.Y(M.pdf(x,mean,sd))} `}pts+=`${g.X(high)},${g.Y(0)}`;s+=`<polygon points="${pts}" fill="${C.teal}" opacity=".35"/>`}s+=curve(g,x=>M.pdf(x,mean,sd));probability=(u===Infinity?1:M.normalCDF((u-mean)/sd))-(l===-Infinity?0:M.normalCDF((l-mean)/sd));formula(`X ~ N(${mean}, ${sd}²)`);table(['Bound','x','z'],[[event==='left'?'Lower tail':'Lower',l===-Infinity?'−∞':l,l===-Infinity?'−∞':fmt((l-mean)/sd)],['Upper',u===Infinity?'∞':u,u===Infinity?'∞':fmt((u-mean)/sd)]]);note('Shaded area represents probability, not curve height. The graph displays μ ± 4σ; tail probabilities include values beyond the visible window. Normal probabilities are numerical approximations.')}else{const n=value('n'),p=value('p'),pmf=M.binomial(n,p);mean=n*p;sd=Math.sqrt(n*p*(1-p));probability=pmf.reduce((sum,v,k)=>sum+(k>=l&&k<=u?v:0),0);g=chart(-.6,n+.6,0,Math.max(...pmf)*1.15,'Successes k','Probability');s=g.s;pmf.forEach((v,k)=>{s+=`<rect x="${g.X(k-.38)}" y="${g.Y(v)}" width="${g.X(.38)-g.X(-.38)}" height="${g.Y(0)-g.Y(v)}" fill="${k>=l&&k<=u?C.teal:'#d7c6e8'}"/>`});formula(`X ~ Bin(${n}, ${p})`);table(['k','P(X = k)','Selected'],pmf.map((v,k)=>[k,v.toFixed(6),k>=l&&k<=u?'Yes':'No']));note('Binomial models count successes in a fixed number of independent trials with the same success probability. Bounds select integer outcomes; endpoints are included.')}svg(s,'Probability distribution with selected region highlighted');legend([['Selected probability',C.teal],['Distribution',C.purple]]);results([['Selected probability',fmt(Math.max(0,Math.min(1,probability)),6)],['Percentage',fmt(probability*100,3)+'%'],['Mean',fmt(mean)],['Standard deviation',fmt(sd)]])};}},
 trigonometry:{title:'Trigonometry Lab',tag:'YEARS 9–10 · METHODS',subtitle:'An angle, a circle, a triangle.',setup(){controls(select('mode','Model',[['circle','Unit circle'],['right','Right triangle'],['cosine','Cosine rule (SAS)']])+slider('angle','Angle θ (degrees)',35,-360,360,1)+pair(input('hyp','Hypotenuse',10,.1,1000),input('sideA','Side b',7,.1,1000))+input('sideB','Side c',9,.1,1000));$('mode').onchange=()=>{$('angle').min=$('mode').value==='circle'?-360:1;$('angle').max=$('mode').value==='circle'?360:$('mode').value==='right'?89:179;$('angle').value=35;$('angleval').textContent=35;run()};update=()=>{const mode=$('mode').value,t=value('angle'),r=t*Math.PI/180,co=Math.cos(r),si=Math.sin(r);$('hyp').disabled=mode!=='right';$('sideA').disabled=mode!=='cosine';$('sideB').disabled=mode!=='cosine';let s='',rows=[];if(mode==='circle'){const cx=420,cy=215,R=160,x=cx+co*R,y=cy-si*R;s=`<path d="M200 215H640 M420 20V410" stroke="#b7a7c3"/><circle cx="420" cy="215" r="160" fill="none" stroke="#d3c0e3" stroke-width="2"/><path d="M420 215L${x} 215L${x} ${y}Z" fill="#d6ede8" stroke="${C.teal}" stroke-width="2"/><path d="M420 215L${x} ${y}" stroke="${C.purple}" stroke-width="4"/><circle cx="${x}" cy="${y}" r="7" fill="${C.red}"/><text x="600" y="236" font-size="14">1</text><text x="436" y="54" font-size="14">1</text><text x="224" y="236" font-size="14">−1</text><text x="436" y="397" font-size="14">−1</text><text x="50" y="70" font-size="18" fill="${C.purple}">θ = ${t}°</text>`;results([['Radians',fmt(r)],['cos θ (x)',fmt(co)],['sin θ (y)',fmt(si)],['tan θ',Math.abs(co)<1e-10?'Undefined':fmt(si/co)]]);formula('P = (cos θ, sin θ)');rows=[['cos θ',co],['sin θ',si],['tan θ',Math.abs(co)<1e-10?'Undefined':si/co]];note('The radius is 1. Anticlockwise angles are positive. The horizontal and vertical coordinates give cosine and sine; tan θ is undefined when cos θ = 0.')}else if(mode==='right'){const H=value('hyp'),op=H*si,adj=H*co,scale=300/H,x=210+adj*scale,y=350-op*scale;s=`<polygon points="210,350 ${x},350 ${x},${y}" fill="#eee3f7" stroke="${C.purple}" stroke-width="3"/><path d="M${x-14} 350v-14h14" fill="none" stroke="#6e537e"/><text x="${(210+x)/2}" y="382" text-anchor="middle" font-size="16">Adjacent</text><text x="${x+15}" y="${(350+y)/2}" font-size="16">Opposite</text><text x="${(210+x)/2-30}" y="${(350+y)/2-15}" font-size="16">Hypotenuse = ${H}</text><text x="230" y="337" font-size="15">${t}°</text>`;formula('sin θ = opposite / hypotenuse');results([['Opposite',fmt(op)],['Adjacent',fmt(adj)],['Hypotenuse',fmt(H)],['Area',fmt(op*adj/2)]]);rows=[['Opposite',op],['Adjacent',adj],['Hypotenuse',H]];note('The triangle is drawn to scale. Change the angle or hypotenuse and compare opposite, adjacent and hypotenuse. Right-triangle mode uses acute angles.')}else{const b=value('sideA'),c=value('sideB'),a=Math.sqrt(b*b+c*c-2*b*c*co),area=.5*b*c*si;const pts=[[0,0],[c,0],[b*co,b*si]],g=chart(...padded(pts.map(p=>p[0])),...padded(pts.map(p=>p[1])),'','',true);s=g.s+line(g,pts[0],pts[1],C.purple)+line(g,pts[0],pts[2],C.teal)+line(g,pts[1],pts[2],C.red);pts.forEach((p,i)=>s+=point(g,...p));s+=`<text x="${g.X(0)+12}" y="${g.Y(0)-12}" font-size="14">A = ${t}°</text>`;formula(`a² = b² + c² − 2bc cos A`);results([['Opposite side a',fmt(a)],['Area ½bc sin A',fmt(area)],['Given b',b],['Given c',c]]);rows=[['a',a],['Area',area]];note('SAS fixes two sides and their included angle. Red is the opposite side a. The angle must be between 0° and 180° (excluding endpoints).')}svg(s,'Interactive trigonometry model');legend([['First side / radius',C.purple],['Projection / second side',C.teal],['Point / opposite side',C.red]]);table(['Quantity','Value'],rows.map(([k,v])=>[k,typeof v==='number'?fmt(v,6):v]))};}},
 finance:{title:'Finance & Sequence Lab',tag:'YEARS 9–10 · APPLICATIONS',subtitle:'Small changes. Long-term patterns.',setup(){controls(select('kind','Model',[['compound','Compound growth / decay'],['simple','Simple interest'],['saving','Savings with deposits'],['loan','Reducing-balance loan'],['sequence','Arithmetic / geometric sequences']])+pair(input('principal','Initial amount / first term',1000,0,1e7),input('rate','Rate per period (%)',5,-99,100))+pair(input('periods','Periods / terms',20,1,600,1),input('payment','Deposit / repayment',100,0,1e6))+select('seq','Sequence type',[['arithmetic','Arithmetic'],['geometric','Geometric']])+input('change','Difference d / ratio r',2,-10,10));update=()=>{const kind=$('kind').value,p=value('principal'),n=value('periods');$('rate').disabled=kind==='sequence';$('payment').disabled=!['saving','loan'].includes(kind);$('seq').disabled=kind!=='sequence';$('change').disabled=kind!=='sequence';let rows,summary;if(kind==='sequence'){const d=value('change'),ar=$('seq').value==='arithmetic';rows=Array.from({length:n},(_,i)=>({period:i+1,balance:ar?p+i*d:p*d**i}));if(rows.some(x=>!Number.isFinite(x.balance)||Math.abs(x.balance)>1e15))throw Error('Values exceed the display range. Reduce the ratio or terms.');summary=[['Term '+n,fmt(rows.at(-1).balance)],['Sum of terms',fmt(M.sum(rows.map(x=>x.balance)))]];formula(ar?`tₙ = ${p} + (n − 1) × ${d}`:`tₙ = ${p} × (${d})ⁿ⁻¹`);note('Sequence terms are indexed from n = 1. Arithmetic sequences add a fixed difference; geometric sequences multiply by a fixed ratio.');table(['Term n','tₙ'],rows.map(r=>[r.period,fmt(r.balance,6)]))}else{const r=value('rate')/100,pay=value('payment'),F=M.finance(p,r,pay,n,kind);rows=F.rows;if(rows.some(x=>!Number.isFinite(x.balance)||Math.abs(x.balance)>1e15))throw Error('Balances exceed the display range. Reduce the rate or periods.');summary=[['Final balance','$'+fmt(F.balance,2)],['Interest total','$'+fmt(F.totalInterest,2)],['Periods modelled',rows.at(-1).period]];if(kind==='loan')summary.push(['Loan status',F.balance===0?'Paid off':pay<=p*r?'Repayment ≤ first interest':'Balance remains']);formula(kind==='simple'?`Bₙ = ${p}(1 + ${r}n)`:`Bₙ₊₁ = (1 + ${r})Bₙ ${kind==='loan'?'− repayment':kind==='saving'?'+ deposit':''}`);note('Rates are per period. Deposits and repayments occur at the end of each period, after interest. Loan repayments are capped at the amount owing. Calculations keep full precision; displayed currency rounds to cents. This is a classroom model without fees.');table(['Period','Balance','Interest','Deposit / repayment'],rows.map(r=>[r.period,fmt(r.balance,2),fmt(r.interest,2),fmt(r.payment,2)]))}const g=chart(0,Math.max(1,rows.at(-1).period),...padded([0,...rows.map(r=>r.balance)]),'Period / term','Value');let s=g.s;for(let i=1;i<rows.length;i++)s+=line(g,[rows[i-1].period,rows[i-1].balance],[rows[i].period,rows[i].balance],C.purple);if(rows.length<80)s+=rows.map(r=>point(g,r.period,r.balance,C.teal,3)).join('');svg(s,'Growth or sequence plot');results(summary);legend([['Value',C.purple]])};}},
 vectors:{title:'Vector & Matrix Lab',tag:'YEARS 10–12 · SPECIALIST',subtitle:'Move, combine and transform.',setup(){controls(select('mode','Investigation',[['vectors','Two-dimensional vectors'],['matrix','2 × 2 matrix transformation']])+pair(input('ax','aₓ',3,-20,20),input('ay','aᵧ',2,-20,20))+pair(input('bx','bₓ',-1,-20,20),input('by','bᵧ',3,-20,20))+slider('scalar','Scalar λ',1,-4,4)+select('op','Vector operation',[['add','a + b'],['subtract','a − b'],['scale','λa'],['projection','Projection of a onto b']])+`<div class="wide muted section">Matrix entries: [ m₁₁ m₁₂ ; m₂₁ m₂₂ ]</div>`+pair(input('m11','m₁₁',1,-5,5),input('m12','m₁₂',1,-5,5))+pair(input('m21','m₂₁',0,-5,5),input('m22','m₂₂',1,-5,5)));update=()=>{const matrix=$('mode').value==='matrix',a=[value('ax'),value('ay')],b=[value('bx'),value('by')];for(const id of ['bx','by','scalar','op'])$(id).disabled=matrix;for(const id of ['m11','m12','m21','m22'])$(id).disabled=!matrix;let v,items,segments=[],extra=[],g;if(matrix){const A=[value('m11'),value('m12'),value('m21'),value('m22')],T=([x,y])=>[A[0]*x+A[1]*y,A[2]*x+A[3]*y],det=A[0]*A[3]-A[1]*A[2],square=[[0,0],[1,0],[1,1],[0,1]];v=T(a);const points=[...square,...square.map(T),a,v];g=chart(...padded(points.map(p=>p[0])),...padded(points.map(p=>p[1])),'x','y',true);for(let i=0;i<4;i++){segments.push(line(g,square[i],square[(i+1)%4],'#bba7cd'));segments.push(line(g,T(square[i]),T(square[(i+1)%4]),C.teal))}extra.push(`<polygon clip-path="url(#plotclip)" points="${square.map(p=>T(p)).map(p=>`${g.X(p[0])},${g.Y(p[1])}`).join(' ')}" fill="${C.teal}" opacity=".15"/>`);items=[['Transformed a',`(${fmt(v[0])}, ${fmt(v[1])})`],['Determinant',fmt(det)],['Area scale',fmt(Math.abs(det))],['Orientation',det===0?'Collapsed':det<0?'Reversed':'Preserved']];formula(`T(x, y) = (${A[0]}x + ${A[1]}y, ${A[2]}x + ${A[3]}y)`);note('The unit square becomes a parallelogram. |det M| is its area; a negative determinant reverses orientation and determinant 0 collapses area.');table(['Point','Original x','Original y','Image x','Image y'],square.map((p,i)=>[i+1,...p,...T(p)]));legend([['Original a',C.purple],['Image / transformed square',C.teal]])}else{const op=$('op').value,ab=M.dot(a,b),na=M.norm(a),nb=M.norm(b);if(op==='projection'&&nb===0)throw Error('Projection onto the zero vector is undefined.');v=op==='add'?a.map((x,i)=>x+b[i]):op==='subtract'?a.map((x,i)=>x-b[i]):op==='scale'?a.map(x=>x*value('scalar')):b.map(x=>x*ab/(nb*nb));const points=[[0,0],a,b,v];g=chart(...padded(points.map(p=>p[0])),...padded(points.map(p=>p[1])),'x','y',true);segments.push(line(g,[0,0],b,C.blue));if(op==='add')segments.push(line(g,a,v,C.blue,'5 4'),line(g,b,v,C.purple,'5 4'));items=[['Result',`(${fmt(v[0])}, ${fmt(v[1])})`],['a · b',fmt(ab)],['|a| / |b|',`${fmt(na)} / ${fmt(nb)}`],['Angle',na*nb===0?'Undefined':fmt(Math.acos(Math.max(-1,Math.min(1,ab/(na*nb))))*180/Math.PI)+'°']];formula({add:'a + b',subtract:'a − b',scale:'λa',projection:'projᵦ a = [(a · b) / |b|²] b'}[op]);note('Vectors start at the origin. Dashed lines show tip-to-tail addition. The angle is undefined if either vector is zero. Projection uses the direction of b.');table(['Vector','x','y','Magnitude'],[['a',...a,fmt(na)],['b',...b,fmt(nb)],['Result',...v.map(x=>fmt(x)),fmt(M.norm(v))]]);legend([['a',C.purple],['b',C.blue],['Result',C.teal]])}let s=g.s+extra.join('')+segments.join('')+line(g,[0,0],a,C.purple)+line(g,[0,0],v,C.teal)+point(g,...a,C.purple)+point(g,...v,C.teal);svg(s,'Vectors or matrix transformation on equal-scale coordinate axes');results(items)};}},
 complex:{title:'Complex Number Lab',tag:'SPECIALIST',subtitle:'Algebra on the Argand plane.',setup(){controls(pair(input('re','Real part of z',2,-10,10),input('im','Imaginary part of z',1,-10,10))+pair(input('wr','Real part of w',1,-10,10),input('wi','Imaginary part of w',1,-10,10))+select('operation','Operation',[['add','z + w'],['multiply','z × w'],['divide','z ÷ w'],['power','zⁿ'],['roots','nth roots of z']])+input('power','Power / root n',3,1,12,1));update=()=>{const z=[value('re'),value('im')],w=[value('wr'),value('wi')],op=$('operation').value,n=value('power'),isRoots=op==='roots';$('power').disabled=!['power','roots'].includes(op);$('wr').disabled=$('wi').disabled=['power','roots'].includes(op);let out=isRoots?M.roots(z,n):[M.complex(z,w,op,n)],all=[[0,0],z,...(['add','multiply','divide'].includes(op)?[w]:[]),...out];if(all.some(p=>M.norm(p)>1e12))throw Error('Result is too large to display. Reduce the power.');const g=chart(...padded(all.map(p=>p[0])),...padded(all.map(p=>p[1])),'Real','Imaginary',true);let s=g.s+line(g,[0,0],z,C.purple)+point(g,...z,C.purple);if(['add','multiply','divide'].includes(op))s+=line(g,[0,0],w,C.blue)+point(g,...w,C.blue);out.forEach((p,i)=>{s+=line(g,[0,0],p,C.teal)+point(g,...p,C.teal);if(isRoots)s+=`<text x="${g.X(p[0])+8}" y="${g.Y(p[1])-8}" font-size="12" fill="${C.teal}">k=${i}</text>`});const complexText=p=>`${fmt(p[0])} ${p[1]<0?'−':'+'} ${fmt(Math.abs(p[1]))}i`,r=M.norm(z),theta=r===0?null:Math.atan2(z[1],z[0]);formula(isRoots?'Roots: r¹⁄ⁿ cis((θ + 2kπ) / n)':'z = r(cos θ + i sin θ)');results([['|z|',fmt(r)],['arg z (radians)',fmt(theta)],['arg z (degrees)',theta===null?'Undefined':fmt(theta*180/Math.PI)+'°'],[isRoots?'Distinct roots':'Result',isRoots?(r===0?1:n):complexText(out[0])]]);svg(s,'Argand diagram of complex values and results');legend([['z',C.purple],['w',C.blue],['Result / roots',C.teal]]);note('Principal arguments use −π < θ ≤ π. Multiplication multiplies moduli and adds arguments. For non-zero z, nth roots are equally spaced around a circle. Zero has undefined argument and one distinct nth root.');table(['Value','Real','Imaginary','Modulus','Argument (rad)'],out.map((p,i)=>[isRoots?'k = '+i:'Result',fmt(p[0],6),fmt(p[1],6),fmt(M.norm(p),6),M.norm(p)<1e-12?'Undefined':fmt(Math.atan2(p[1],p[0]),6)]))};}},
 networks:{title:'Network Lab',tag:'APPLICATIONS',subtitle:'Find the route. Connect the network.',setup(){controls(`<div class="wide"><label for="edges">Edges: vertex vertex weight (one per line)</label><textarea id="edges" rows="7">A B 4\nA C 2\nB C 1\nB D 5\nC D 8\nC E 10\nD E 2\nD F 6\nE F 3</textarea></div>`+select('task','Investigation',[['path','Shortest path'],['mst','Minimum spanning tree']])+pair(`<div><label for="start">Start</label><input id="start" value="A" maxlength="8"></div>`,`<div><label for="end">End</label><input id="end" value="F" maxlength="8"></div>`));update=()=>{const lines=$('edges').value.trim().split(/\n/).filter(x=>x.trim()),edges=lines.map(l=>{const p=l.trim().split(/[\s,]+/);if(p.length!==3||!/^[A-Za-z0-9]{1,8}$/.test(p[0])||!/^[A-Za-z0-9]{1,8}$/.test(p[1])||p[0]===p[1]||!Number.isFinite(Number(p[2]))||Number(p[2])<=0||Number(p[2])>1e6)throw Error('Use edges such as A B 4, with distinct alphanumeric vertices and positive weights up to 1,000,000.');return[p[0],p[1],Number(p[2])]});const names=[...new Set(edges.flatMap(e=>[e[0],e[1]]))];if(names.length<2||names.length>12||edges.length>30)throw Error('Use 2–12 vertices and at most 30 edges.');const keys=edges.map(([a,b])=>[a,b].sort().join('|'));if(new Set(keys).size!==keys.length)throw Error('Use one edge per pair of vertices.');const task=$('task').value,isMST=task==='mst';$('start').disabled=$('end').disabled=isMST;const R=M.network(edges,isMST?names[0]:$('start').value.trim(),isMST?names[0]:$('end').value.trim()),N=R.nodes.length,pts=Object.fromEntries(R.nodes.map((v,i)=>[v,[420+290*Math.cos(-Math.PI/2+i*2*Math.PI/N),220+175*Math.sin(-Math.PI/2+i*2*Math.PI/N)]])),selected=isMST?R.mst:R.path,reveal=$('reveal').checked;let s='';edges.forEach(([a,b,w],i)=>{const p=pts[a],q=pts[b],x=(p[0]+q[0])/2,y=(p[1]+q[1])/2,active=reveal&&selected.includes(i);s+=`<path d="M${p}L${q}" stroke="${active?C.teal:'#c2b2ce'}" stroke-width="${active?5:2}"/><rect x="${x-18}" y="${y-12}" width="36" height="24" rx="6" fill="#fcf9ff"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" fill="#604675">${fmt(w)}</text>`});for(const [v,[x,y]]of Object.entries(pts))s+=`<circle cx="${x}" cy="${y}" r="22" fill="${C.purple}"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" fill="white">${esc(v)}</text>`;svg(s,'Undirected weighted graph with optional highlighted solution');formula(isMST?'Connect every vertex with minimum total edge weight.':`Shortest path: ${$('start').value.trim()} → ${$('end').value.trim()}`);results(isMST?[['Total weight',fmt(R.weight)],['Edges selected',R.mst.length],['Structure',R.connected?'Spanning tree':'Spanning forest']]:[['Shortest distance',Number.isFinite(R.distance)?fmt(R.distance):'No route'],['Edges used',R.path.length],['Vertices',N]]);note(isMST?'Kruskal’s algorithm adds the cheapest available edge that does not form a cycle. A disconnected network has a minimum spanning forest, not a spanning tree. Tied weights may allow several equally good trees.':'Dijkstra’s algorithm finds a shortest path on this undirected network. All weights must be positive. A tie may give several shortest routes; one is highlighted.');table(['Edge','Weight','Selected'],edges.map(([a,b,w],i)=>[a+'–'+b,w,selected.includes(i)?'Yes':'No']));legend([['Vertices',C.purple],['Solution edges',C.teal]])};}}
};
Object.assign(labs,{
 arrays:{title:'Probability Array Lab',tag:'YEARS 7–10',subtitle:'Every possible pair, in one place.',setup(){controls(select('arrayMode','Experiment',[['dice','Two dice: investigate sums'],['custom','Two sets of choices']])+pair(select('facesA','Faces on die A',[[4,'4'],[6,'6'],[8,'8'],[10,'10'],[12,'12'],[20,'20']]),select('facesB','Faces on die B',[[4,'4'],[6,'6'],[8,'8'],[10,'10'],[12,'12'],[20,'20']]))+`<div class="wide"><label for="choicesA">Choices in set A (comma separated)</label><input id="choicesA" value="Shorts, Pants"><label for="choicesB">Choices in set B (comma separated)</label><input id="choicesB" value="Shirt, Jumper, Jacket"></div>`+select('condition','Highlight sums',[['equal','Equal to target'],['atleast','At least target'],['atmost','At most target'],['even','Even'],['odd','Odd']])+input('target','Target sum',7,0,40,1));$('facesA').value=$('facesB').value='6';let selected=new Set,lastKey='';update=()=>{const dice=$('arrayMode').value==='dice';for(const id of ['choicesA','choicesB'])$(id).disabled=dice;for(const id of ['facesA','facesB','condition','target'])$(id).disabled=!dice;const split=s=>s.split(',').map(x=>x.trim()).filter(Boolean);const a=dice?Array.from({length:Number($('facesA').value)},(_,i)=>i+1):split($('choicesA').value),b=dice?Array.from({length:Number($('facesB').value)},(_,i)=>i+1):split($('choicesB').value);if(!a.length||!b.length||a.length>20||b.length>20||[...a,...b].some(x=>String(x).length>20))throw Error('Use 1–20 choices per set, with labels up to 20 characters.');const key=JSON.stringify([a,b,dice]);if(key!==lastKey){selected=new Set;lastKey=key}const target=value('target'),cond=$('condition').value,pick=(i,j)=>dice?(cond==='equal'?a[i]+b[j]===target:cond==='atleast'?a[i]+b[j]>=target:cond==='atmost'?a[i]+b[j]<=target:cond==='even'?(a[i]+b[j])%2===0:(a[i]+b[j])%2!==0):selected.has(i+':'+j);let count=0,s='',rows=[],w=720/b.length,h=340/a.length;for(let j=0;j<b.length;j++)s+=`<text x="${110+(j+.5)*w}" y="30" text-anchor="middle" font-size="${b.length>10?10:12}" fill="${C.purple}">${esc(String(b[j]).slice(0,12))}</text>`;for(let i=0;i<a.length;i++){s+=`<text x="100" y="${50+(i+.5)*h+4}" text-anchor="end" font-size="${a.length>10?10:12}" fill="${C.blue}">${esc(String(a[i]).slice(0,12))}</text>`;for(let j=0;j<b.length;j++){const active=pick(i,j);if(active)count++;const label=dice?a[i]+b[j]:(i+1)+','+(j+1);s+=`<g data-cell="${i}:${j}" ${dice?'':`role="button" tabindex="0" aria-label="${esc(a[i]+', '+b[j])}" aria-pressed="${active}" style="cursor:pointer"`}><rect x="${110+j*w}" y="${50+i*h}" width="${w}" height="${h}" fill="${active?'#c5e9e1':'#f5effa'}" stroke="white" stroke-width="2"/><text x="${110+(j+.5)*w}" y="${50+(i+.5)*h+4}" font-size="${Math.min(15,h*.55,w*.45)}" text-anchor="middle" fill="#543969">${esc(label)}</text><title>${esc(a[i]+', '+b[j])}</title></g>`;rows.push([a[i],b[j],dice?a[i]+b[j]:a[i]+', '+b[j],active?'Yes':'No'])}}svg(s,'Sample space array. Green cells show the selected event.');formula(dice?'Each cell is one equally likely ordered pair.':'Select cells to build an event. Cell numbers give row, column.');const total=a.length*b.length;results([['Possible pairs',total],['Selected pairs',count],['Probability',`${count}/${total}`],['Percentage',fmt(count/total*100,2)+'%']]);note(dice?'Rows represent die A; columns represent die B. The two dice are independent and fair. Different orders are separate outcomes.':'This model assumes each listed choice is equally likely and stages are independent. Click or press Enter on a cell to include it in your event. Full names appear in the table and cell tooltip.');legend([['Selected event',C.teal]]);table(['Set A','Set B','Result','Selected'],rows);$('viz').onclick=e=>{const cell=e.target.closest('[data-cell]');if(!cell||dice)return;const id=cell.dataset.cell;selected.has(id)?selected.delete(id):selected.add(id);run()};$('viz').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const cell=e.target.closest('[data-cell]');if(cell&&!dice){e.preventDefault();cell.dispatchEvent(new MouseEvent('click',{bubbles:true}))}}};};}},
 measurement:{title:'Measurement & Scale Lab',tag:'YEARS 7–10',subtitle:'Length changes. Area and volume follow.',setup(){controls(select('shape','Shape',[['rectangle','Rectangle'],['triangle','Right triangle'],['circle','Circle'],['cuboid','Cuboid'],['cylinder','Cylinder'],['sphere','Sphere']])+pair(input('length','Length / radius',4,.1,100),input('height','Height',3,.1,100))+input('depth','Depth',2,.1,100)+slider('scale','Linear scale factor k',1.5,.1,4,.1)+select('unit','Length unit',[['cm','cm'],['m','m'],['mm','mm']]));update=()=>{const shape=$('shape').value,L=value('length'),H=value('height'),D=value('depth'),k=value('scale'),u=$('unit').value;$('height').disabled=['circle','sphere'].includes(shape);$('depth').disabled=shape!=='cuboid';const area={rectangle:L*H,triangle:L*H/2,circle:Math.PI*L*L,cuboid:2*(L*H+L*D+H*D),cylinder:2*Math.PI*L*(L+H),sphere:4*Math.PI*L*L}[shape],volume={cuboid:L*H*D,cylinder:Math.PI*L*L*H,sphere:4*Math.PI*L**3/3}[shape],perimeter={rectangle:2*(L+H),triangle:L+H+Math.hypot(L,H),circle:2*Math.PI*L}[shape],is3=volume!==undefined;const dims={rectangle:[L,H],triangle:[L,H],circle:[2*L,2*L],cuboid:[L+D*.45,H+D*.35],cylinder:[2*L,H+L*.6],sphere:[2*L,2*L]}[shape],factor=Math.min(250/(dims[0]*Math.max(1,k)),230/(dims[1]*Math.max(1,k)));function model(cx,cy,scale,color){const l=L*factor*scale,h=H*factor*scale,d=D*factor*scale,r=l;let s='';if(shape==='rectangle')s=`<rect x="${cx-l/2}" y="${cy-h/2}" width="${l}" height="${h}"/>`;if(shape==='triangle')s=`<path d="M${cx-l/2} ${cy+h/2}H${cx+l/2}V${cy-h/2}Z"/>`;if(shape==='circle'||shape==='sphere'){s=`<circle cx="${cx}" cy="${cy}" r="${r}"/>`;if(shape==='sphere')s+=`<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*.28}" stroke-dasharray="5 4"/>`}if(shape==='cylinder'){const ry=r*.25;s=`<path d="M${cx-r} ${cy-h/2}V${cy+h/2}A${r} ${ry} 0 0 0 ${cx+r} ${cy+h/2}V${cy-h/2}"/><ellipse cx="${cx}" cy="${cy-h/2}" rx="${r}" ry="${ry}"/><path d="M${cx-r} ${cy+h/2}A${r} ${ry} 0 0 1 ${cx+r} ${cy+h/2}" stroke-dasharray="5 4"/>`}if(shape==='cuboid'){const x=cx-l/2,y=cy+h/2,dx=d*.45,dy=-d*.35;s=`<path d="M${x} ${y}h${l}v${-h}h${-l}Z M${x} ${y-h}l${dx} ${dy}h${l}v${h}l${-dx} ${-dy} M${x+l} ${y-h}l${dx} ${dy}"/>`}return `<g fill="${color}" fill-opacity=".12" stroke="${color}" stroke-width="2.5">${s}</g>`}const s=model(215,225,1,C.purple)+model(615,225,k,C.teal)+`<text x="215" y="50" text-anchor="middle" fill="${C.purple}" font-size="17">Original</text><text x="615" y="50" text-anchor="middle" fill="${C.teal}" font-size="17">Scaled by ${k}</text><text x="215" y="405" text-anchor="middle" font-size="13">Length / radius = ${L} ${u}</text><text x="615" y="405" text-anchor="middle" font-size="13">Length / radius = ${fmt(L*k)} ${u}</text>`;svg(s,'Original and scaled shape, using the same drawing scale');formula('Lengths × k • Areas × k²'+(is3?' • Volumes × k³':''));results([[(is3?'Surface area':'Area')+' (original)',fmt(area)+' '+u+'²'],[(is3?'Surface area':'Area')+' (scaled)',fmt(area*k*k)+' '+u+'²'],[is3?'Volume (original)':'Perimeter (original)',fmt(is3?volume:perimeter)+' '+u+(is3?'³':'')],[is3?'Volume (scaled)':'Perimeter (scaled)',fmt(is3?volume*k**3:perimeter*k)+' '+u+(is3?'³':'')]]);note('Every linear dimension scales by the same factor. Solid drawings are schematic; spheres show an equator and cylinders include both circular ends in surface area. Changing units changes the label, not the numerical measurements.');legend([['Original',C.purple],['Scaled',C.teal]]);table(['Quantity','Original','Scaled'],[['Length / radius',L,fmt(L*k)],['Area / surface area',fmt(area),fmt(area*k*k)],[is3?'Volume':'Perimeter',fmt(is3?volume:perimeter),fmt(is3?volume*k**3:perimeter*k)]]);};}},
 ratios:{title:'Ratio & Rate Lab',tag:'YEARS 7–10',subtitle:'Compare quantities on the same basis.',setup(){controls(select('mode','Investigation',[['ratio','Share in a ratio'],['speed','Distance, speed and time'],['value','Compare unit prices']])+pair(input('ra','Ratio part A',2,1,100,1),input('rb','Ratio part B',3,1,100,1))+input('total','Total to share',100,.01,1e6)+pair(input('distance','Distance (km)',120,.01,1e6),input('time','Time (minutes)',90,.01,1e6))+pair(input('costA','Cost A ($)',6,.01,1e6),input('qtyA','Quantity A',500,.01,1e6))+pair(input('costB','Cost B ($)',9,.01,1e6),input('qtyB','Quantity B',800,.01,1e6)));update=()=>{const mode=$('mode').value;for(const id of ['ra','rb','total'])$(id).disabled=mode!=='ratio';for(const id of ['distance','time'])$(id).disabled=mode!=='speed';for(const id of ['costA','qtyA','costB','qtyB'])$(id).disabled=mode!=='value';let s='';if(mode==='ratio'){const a=value('ra'),b=value('rb'),total=value('total'),one=total/(a+b),A=one*a,B=one*b;s=`<rect x="65" y="130" width="${710*a/(a+b)}" height="100" rx="5" fill="${C.purple}"/><rect x="${65+710*a/(a+b)}" y="130" width="${710*b/(a+b)}" height="100" rx="5" fill="${C.teal}"/><text x="220" y="280" text-anchor="middle" fill="${C.purple}" font-size="20">A: ${a} parts</text><text x="620" y="280" text-anchor="middle" fill="${C.teal}" font-size="20">B: ${b} parts</text>`;if(a+b<=40)for(let i=1;i<a+b;i++)s+=`<path d="M${65+710*i/(a+b)} 130v100" stroke="white"/>`;formula(`A : B = ${a} : ${b}`);results([['One part',fmt(one)],['Share A',fmt(A)],['Share B',fmt(B)],['A + B',fmt(A+B)]]);note('The total is divided into a + b equal parts. Multiply the value of one part by each ratio number. Labels keep the original ratio; the bar shows its proportions.');table(['Quantity','Value'],[['One part',one],['A',A],['B',B]])}else if(mode==='speed'){const d=value('distance'),t=value('time'),speed=d/(t/60),g=chart(0,t,0,d,'Time (minutes)','Distance (km)');s=g.s+line(g,[0,0],[t,d],C.purple);formula('Average speed = distance ÷ time');results([['Average speed',fmt(speed)+' km/h'],['Average speed',fmt(speed/3.6)+' m/s'],['Time',fmt(t/60)+' hours'],['Distance',fmt(d*1000)+' metres']]);note('The straight line models travelling at a constant speed. For a real journey, total distance divided by total time gives average speed. Convert minutes to hours before using km/h.');table(['Time (minutes)','Distance (km)'],Array.from({length:6},(_,i)=>[fmt(t*i/5),fmt(d*i/5)]))}else{const ca=value('costA'),cb=value('costB'),qa=value('qtyA'),qb=value('qtyB'),u=ca/qa,v=cb/qb,max=Math.max(u,v),wa=650*u/max,wb=650*v/max;s=`<text x="65" y="95" font-size="18">Cost per 100 units</text><rect x="90" y="135" width="${wa}" height="55" fill="${C.purple}"/><rect x="90" y="250" width="${wb}" height="55" fill="${C.teal}"/><text x="60" y="170" font-size="18">A</text><text x="60" y="285" font-size="18">B</text>`;formula('Unit price = cost ÷ quantity');results([['A per 100 units','$'+fmt(u*100,2)],['B per 100 units','$'+fmt(v*100,2)],['Better unit price',Math.abs(u-v)<1e-10?'Equal':u<v?'A':'B'],['Difference per unit','$'+fmt(Math.abs(u-v),4)]]);note('Enter both quantities in the same unit (for example, both in grams). Lower cost per unit is better value when quality is comparable. Bar lengths use unrounded unit prices.');table(['Option','Cost','Quantity','Cost per unit'],[['A',ca,qa,fmt(u,6)],['B',cb,qb,fmt(v,6)]])}svg(s,'Ratio or rate comparison');legend([['A / distance',C.purple],['B',C.teal]])};}},
 sampling:{title:'Sampling Lab',tag:'METHODS · SPECIALIST',subtitle:'One population. Many sample means.',setup(){controls(input('sampleN','Sample size n',30,1,100,1)+`<div class="wide muted">Population: a fair six-sided die (values 1–6). Samples are independent and taken with replacement.</div><div class="actions wide"><button id="sample100" class="primary">Take 100 samples</button><button id="sample1000">Take 1,000 samples</button><button id="clearSamples">Clear samples</button></div>`+check('normalOverlay','Overlay normal approximation')+check('intervals','Show approximate 95% mean intervals'));let samples=[],key=30;const randomDie=()=>{const a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=4294967292);return a[0]%6+1};const take=count=>{try{const n=value('sampleN');if(n!==key){samples=[];key=n}for(let i=0;i<count;i++){let total=0;for(let j=0;j<n;j++)total+=randomDie();samples.push(total/n)}if(samples.length>10000)samples=samples.slice(-10000);run()}catch(e){$('error').textContent=e.message}};$('sample100').onclick=()=>take(100);$('sample1000').onclick=()=>take(1000);$('clearSamples').onclick=()=>{samples=[];run()};update=()=>{const n=value('sampleN');if(n!==key){samples=[];key=n}const mu=3.5,sigma=Math.sqrt(35/12),se=sigma/Math.sqrt(n),binCount=30,w=5/binCount,counts=Array(binCount).fill(0);samples.forEach(x=>counts[Math.min(binCount-1,Math.floor((x-1)/w))]++);let max=Math.max(1,...counts.map(c=>c/(Math.max(samples.length,1)*w)));if($('normalOverlay').checked)max=Math.max(max,M.pdf(mu,mu,se));const g=chart(1,6,0,max*1.15,'Sample mean','Density'),s0=g.s;let s=s0;counts.forEach((c,i)=>s+=`<rect x="${g.X(1+i*w)}" y="${g.Y(c/(Math.max(samples.length,1)*w))}" width="${750/binCount}" height="${g.Y(0)-g.Y(c/(Math.max(samples.length,1)*w))}" fill="#c8b0e0" stroke="white"/>`);if($('normalOverlay').checked)s+=curve(g,x=>M.pdf(x,mu,se),C.teal);s+=line(g,[mu,0],[mu,max*1.15],C.red,'5 4');if($('intervals').checked&&samples.length){const recent=samples.slice(-30),lo=Math.min(mu,...recent.map(m=>m-1.96*se)),hi=Math.max(mu,...recent.map(m=>m+1.96*se)),g2=chart(...padded([lo,hi]),0,recent.length+1,'Mean interval','Recent sample');let intervals=g2.s+line(g2,[mu,0],[mu,recent.length+1],C.red,'5 4');recent.forEach((m,i)=>{const color=Math.abs(m-mu)<=1.96*se?C.teal:C.gold;intervals+=line(g2,[m-1.96*se,i+1],[m+1.96*se,i+1],color)+point(g2,m,i+1,color,3)});svg(intervals,'Approximate 95% intervals for the latest 30 samples. Red line is the true population mean.')}else svg(s,'Distribution of simulated sample means');formula('E(X̄) = μ; SD(X̄) = σ / √n');const within=samples.filter(m=>Math.abs(m-mu)<=1.96*se).length;results([['Samples stored',samples.length],['Population μ',mu],['Theoretical standard error',fmt(se)],['Mean of sample means',samples.length?fmt(M.mean(samples)):'—'],['Empirical SD of means',samples.length?fmt(M.stats(samples).sd):'—'],['Intervals containing μ',samples.length?fmt(within/samples.length*100,1)+'%':'—']]);note('Each sample mean comes from n fair die rolls. The normal approximation generally improves with larger n. Intervals use the known population σ: x̄ ± 1.96σ/√n; 95% coverage is approximate, not guaranteed. Up to 10,000 samples are retained. Changing n clears old samples.');legend([['Sample means',C.purple],['Normal approximation',C.teal],['Population mean',C.red]]);const ci=$('intervals').checked;table(ci?['Sample','Mean','Lower','Upper','Contains μ']:['Sample','Mean'],samples.map((m,i)=>ci?[i+1,fmt(m),fmt(m-1.96*se),fmt(m+1.96*se),Math.abs(m-mu)<=1.96*se?'Yes':'No']:[i+1,fmt(m)]))};}}
});

function launch(id){if(!labs[id])id='functions';current=id;const L=labs[id];$('title').textContent=L.title;$('brand').textContent=L.title;$('tag').textContent=L.tag;$('subtitle').textContent=L.subtitle;document.title=L.title+' · Mr Day’s Maths Tools';$('activity').value=id;$('results').innerHTML='';$('table').innerHTML='';$('legend').innerHTML='';$('viz').onclick=null;$('viz').onkeydown=null;L.setup();run()}
$('activity').innerHTML=Object.entries(labs).map(([id,l])=>`<option value="${id}">${l.title}</option>`).join('');$('activity').onchange=()=>location.hash=$('activity').value;window.addEventListener('hashchange',()=>launch(location.hash.slice(1)));launch(location.hash.slice(1));
</script></body></html>
