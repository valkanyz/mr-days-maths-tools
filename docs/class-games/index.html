switch(kind){case'cash':if(!Number.isSafeInteger(amount)||amount<0)throw Error('Enter a whole-number amount of 0 or more.');a.cash+=amount;break;case'bank':a.bank+=a.cash;a.cash=0;break;case'bomb':a.cash=0;break;case'double':a.cash*=2;break;case'shield':case'mirror':a[kind]++;break;case'present':b.cash+=1000;break;case'ship':from.cash+=to.cash;to.cash=0;break;case'dagger':to.cash=0;break;case'swap':[from.cash,to.cash]=[to.cash,from.cash];break;default:throw Error('Choose a supported action.')}if(p.some(x=>!Number.isSafeInteger(x.cash)||!Number.isSafeInteger(x.bank)))throw Error('Score is too large.');return p}
function rowAttack(players,row,defences){let p=clone(players);if(!p.some(x=>x.row===row))throw Error('No players in that row.');if(defences.length!==0&&defences.length!==2)throw Error('Use exactly two defences, or none.');for(const d of defences){let a=p[d.player];if(!a||a.row!==row||!['shield','mirror'].includes(d.kind)||a[d.kind]<1)throw Error('Both defences must be held by players in the attacked row.');a[d.kind]--}if(!defences.length)p.forEach(x=>{if(x.row===row)x.cash=0});return p}

function planFleet(p,plan,c){for(const k of['boats','pots','shallow','deep'])if(!Number.isInteger(plan[k])||plan[k]<0)throw Error('Use whole numbers of 0 or more.');const cost=plan.boats*c.boatCost+plan.pots*c.potCost,boats=p.boats+plan.boats,pots=p.pots+plan.pots;if(cost>p.cash)throw Error(p.name+': purchases exceed cash.');if(plan.shallow+plan.deep>pots)throw Error(p.name+': more pots placed than owned.');if(plan.shallow+plan.deep>boats*c.capacity)throw Error(p.name+': boat capacity exceeded.');return {...p,cash:p.cash-cost,boats,pots,shallow:plan.shallow,deep:plan.deep,cost}}

ss row for ${esc(p.name)}" data-row="${i}">${Array.from({length:6},(_,n)=>`<option ${p.row===n+1?'selected':''}>${n+1}</option>`).join('')}</select></td><td>${fmt(p.cash)}</td><td>${fmt(p.bank)}</td><td>${p.shield} / ${p.mirror}</td><td><b>${fmt(p.cash+p.bank)}</b></td></tr>`).join('')}</tbody></table></div><details><summary>☠ Row attack</summary><p class="muted">Use after a player reveals their skull. Banked points stay safe. Two shields/mirrors from the attacked row block the attack; mirrors are spent as row defences, not reflected.</p><div class="row"><div><label for="attackRow">Attacked classroom row</label><select id="attackRow">${Array.from({length:6},(_,i)=>`<option>${i+1}</option>`).join('')}</select></div>${[1,2].map(n=>`<div><label for="rowDef${n}">Defence ${n}</label><select id="rowDef${n}"><option value="">None</option>${s.p.flatMap((p,i)=>['shield','mirror'].filter(k=>p[k]>0).map(k=>`<option value="${i}:${k}">${esc(p.name)} · ${k} (${p[k]})</option>`)).join('')}</select></div>`).join('')}${btn('rowAttack','Resolve row attack')}</div></details></section>${s.called.length===49?`<section class="panel"><h2>Final totals</h2>${scorecards(total,'total')}</section>`:''}`;

$('rules').innerHTML=`<h2>How to host</h2><ol><li>Students place one of each of the 11 symbols, plus 5,000 × 1; 3,000 × 2; 1,000 × 10; 200 × 25 into their 49 squares.</li><li>Call a coordinate. Everyone crosses it off and collects that square’s value or action. Ship, dagger, present, swap, choose and skull: raise a hand.</li><li>Shields and mirrors are stored until used once. Bank moves all cash into safety. Highest cash + bank wins.</li></ol><div class="rulekey">${G.symbols.map(x=>`<div><b>${x[1]}</b>${x[2]}</div>`).join('')}</div><details><summary>Action rules &amp; resolution conventions</summary><p>Ship transfers the target’s unbanked cash to the attacker. Dagger wipes the target’s cash. Present creates 1,000 for the chosen player. Swap exchanges unbanked cash. Bomb wipes your own cash; ×2 doubles only cash. Shield cancels one attack. Mirror reverses a steal or wipe; reflecting a swap still swaps the same two players. Banked points are never stolen, swapped, doubled or wiped.</p><p>Based on the uploaded Pirate Game rules. House conventions for ambiguous cases: no self-targeting; no chained reflections; personal defences apply to ship, dagger and swap, not your own bomb; a row attack needs exactly two held defences from that row, in any combination. Choose requests are queued in the order the teacher enters them. The next manually chosen coordinate consumes the first request.</p></details>`;

function renderCray(){const s=state(),c=s.c,finished=s.phase==='done',locked=s.phase==='locked',results=s.phase==='results',planning=s.phase==='plan';$('stage').innerHTML=hero(s.die?['','⚀','⚁','⚂','⚃','⚄','⚅'][s.die]:'🦞',finished?'Season complete · cash + fleet value':`Day ${s.day} of ${c.days} · ${locked?'Plans locked · ready to roll':results?(s.weather==='calm'?'☀ Calm seas':'⛈ Storm · deep pots lost'):'Buy and place pots before the weather'}`,'ocean')+`<section class="panel"><div class="row"><span class="ball">Calm: shallow $${c.shallowGood}, deep $${c.deepGood} / pot</span><span class="ball">Storm: shallow $${c.shallowBad}, deep pots lost</span></div><p class="muted">1–3 calm · 4 repeats previous weather · 5–6 storm. Previous weather: <b>${s.weather}</b>. One roll applies to everyone.</p><div class="row">${btn('lockPlans','Lock all plans','primary',!planning)}${btn('rollWeather','🎲 Roll weather','gold',!locked)}${btn('nextDay',s.day===c.days?'Finish season':'Next day','',!results)}</div></section><section class="panel"><h2>${finished?'Final fleet values':planning?'Fleet plans':locked?'Locked fleet plans':'Day '+s.day+' results'}</h2><p class="muted">${planning?'Purchases are paid from today’s opening cash. Pots not placed stay safely ashore. New purchases can be used today.':'Pots can only be bought or moved during the planning phase.'}</p><div class="scroll"><table><thead><tr><th>Team</th><th>Cash</th><th>Boats</th><th>Pots</th>${planning?'<th>Buy boats</th><th>Buy pots</th><th>Shallow</th><th>Deep</th>':'<th>Shallow</th><th>Deep</th><th>Income</th><th>Lost</th>'}<th>Net worth</th></tr></thead><tbody>${s.p.map((p,i)=>`<tr><td>${esc(p.name)}</td><td>$${fmt(p.cash)}</td><td>${p.boats}</td><td>${p.pots}</td>${planning?['boats','pots','shallow','deep'].map(k=>`<td><input aria-label="${k==='boats'?'Buy boats':k==='pots'?'Buy pots':k==='shallow'?'Shallow pots':'Deep pots'} for ${esc(p.name)}" id="plan_${i}_${k}" type="number" min="0" max="10000" step="1" value="${k==='shallow'?p.pots:0}"></td>`).join(''):`<td>${p.shallow}</td><td>${p.deep}</td><td>$${fmt(p.income)}</td><td>${p.lost}</td>`}<td><b>$${fmt(p.cash+p.boats*c.boatCost+p.pots*c.potCost)}</b></td></tr>`).join('')}</tbody></table></div>${finished?'<h3 style="margin-top:20px">Final standings</h3>'+scorecards(s.p.map(p=>({...p,worth:p.cash+p.boats*c.boatCost+p.pots*c.potCost})),'worth'):''}</section><section class="panel"><h2>Season record</h2><div class="scroll"><table><thead><tr><th>Day</th><th>Die</th><th>Weather</th><th>Class income</th><th>Pots lost</th></tr></thead><tbody>${s.records.map(r=>`<tr><td>${r.day}</td><td>${r.die}</td><td>${r.weather}</td><td>$${fmt(r.income)}</td><td>${r.lost}</td></tr>`).join('')||'<tr><td colspan="5">No fishing days completed yet.</td></tr>'}</tbody></table></div></section>`;
const labels={days:'Days',cash:'Starting cash',boats:'Starting boats',pots:'Starting pots',boatCost:'Boat price / final value',potCost:'Pot price / final value',capacity:'Pots per boat',shallowGood:'Calm: shallow income',shallowBad:'Storm: shallow income',deepGood:'Calm: deep income'};$('settings').innerHTML='<h3>House rules</h3><p class="muted">Edit before starting a new game. Current season settings are fixed.</p><div class="setupgrid">'+Object.entries(labels).map(([k,l])=>`<div><label for="cfg_${k}">${l}</label><input id="cfg_${k}" type="number" min="${['days','boatCost','potCost','capacity'].includes(k)?1:0}" max="${k==='days'?30:10000}" value="${c[k]}"></div>`).join('')+'</div>'+btn('printCray','Print student ledger','small');
$('rules').innerHTML=`<h2>How to host Cray Pots</h2><ol><li>Start with $${c.cash}, ${c.boats} boats and ${c.pots} pots per team. Choose how many boats and pots to buy, then split deployed pots between shallow and deep water. Maximum ${c.capacity} deployed pots per boat.</li><li>Lock every team’s plan before rolling the shared weather die. On the first day, a 4 uses calm weather.</li><li>In calm weather, each shallow pot earns $${c.shallowGood} and each deep pot earns $${c.deepGood}. In a storm, shallow pots earn $${c.shallowBad}; all deployed deep pots are lost and earn nothing. Boats and stored pots stay safe.</li><li>After ${c.days} days, compare cash + $${c.boatCost} per boat + $${c.potCost} per remaining pot. Ties share the win.</li></ol><p class="muted">Classroom house version of the shallow/deep-water strategy game. No loans, running costs or mid-season sales. Purchases use opening cash; assets count at their purchase price at the end. Weather is rolled only after plans are locked. For a paper-only class, use one demonstration team and print ledgers for students.</p>`;
hook('lockPlans',()=>{const plans=s.p.map((p,i)=>Object.fromEntries(['boats','pots','shallow','deep'].map(k=>[k,Number($('plan_'+i+'_'+k).value)])));change(()=>{s.p=s.p.map((p,i)=>G.planFleet(p,plans[i],c));s.phase='locked';note('Day '+s.day+': all purchases and pot placements locked.')})});hook('rollWeather',()=>change(()=>{s.die=rand(6)+1;s.weather=G.weather(s.die,s.weather);s.p=s.p.map(p=>G.fish(p,s.weather,c));s.records.push({day:s.day,die:s.die,weather:s.weather,income:s.p.reduce((n,p)=>n+p.income,0),lost:s.p.reduce((n,p)=>n+p.lost,0),teams:G.clone(s.p)});s.phase='results';note('Day '+s.day+': rolled '+s.die+' · '+s.weather+'.')}));hook('nextDay',()=>change(()=>{if(s.day===c.days){s.phase='done';note('Season complete.')}else{s.day++;s.phase='plan';s.die=null;note('Day '+s.day+': planning open.')}}));hook('printCray',printCray)}
function renderRisk(){const s=state(),active=s.p.filter(p=>p.active),finished=s.ended;const roundOver=!active.length;$('stage').innerHTML=hero(s.die?['','⚀','⚁','⚂','⚃','⚄','⚅'][s.die]:'🎲',finished?'Game complete':`Round ${s.round} / ${s.limit} · ${roundOver?'round over':active.length+' still rolling'}`)+`<section class="panel"><div class="heading"><div><h2>Unbanked round score</h2><div style="font-size:48px;font-weight:800;color:#76509b">${s.pot}</div></div><div class="row">${btn('riskRoll','Roll for everyone still in','primary',finished||roundOver)}${btn('riskNext',s.round===s.limit?'Finish game':'Next round','gold',finished||!roundOver)}</div></div><p class="muted">Before each roll, ask who wants to bank. Click their Bank button first. A 1 wipes only this round’s unbanked points for teams still in.</p><div class="leader">${s.p.map((p,i)=>`<div class="team ${p.active?'':'bank'}"><h3>${esc(p.name)}</h3><b>${fmt(p.score)}</b><span class="muted">${finished?'Final total':p.active?'At risk: '+s.pot:'Finished this round'}</span><p>${btn('bank_'+i,'Bank '+s.pot,'small',!p.active||finished||s.pot===0)}</p></div>`).join('')}</div>${finished?'<h3 style="margin-top:20px">Final standings</h3>'+scorecards(s.p):''}</section>`;
$('settings').innerHTML='<h3>Game length</h3><label for="riskRounds">Rounds · applies to a new game</label><input id="riskRounds" type="number" min="1" max="20" value="'+s.limit+'">';$('rules').innerHTML='<h2>How to host Risky Dice</h2><ol><li>Everyone begins each round with zero unbanked points. Roll one shared six-sided die.</li><li>On 2–6, add the roll to the round score. Each team chooses whether to bank that score and sit out, or stay in.</li><li>On a 1, remaining teams lose the round score. Previously banked totals are safe.</li><li>Start a new round when everyone has banked or a 1 is rolled. Highest total after the final round wins; ties share the win.</li></ol><p class="muted">This is a whole-class bank-or-roll variant. Record decisions before rolling so no one banks after seeing the result.</p>';
s.p.forEach((p,i)=>hook('bank_'+i,()=>change(()=>{p.score+=s.pot;p.active=false;note(p.name+' banked '+s.pot+' in round '+s.round+'.')})));hook('riskRoll',()=>change(()=>{s.die=rand(6)+1;if(s.die===1){s.p.forEach(p=>p.active=false);note('Rolled 1: unbanked round points lost.');s.pot=0}else{s.pot+=s.die;note('Rolled '+s.die+' · round score '+s.pot)}}));hook('riskNext',()=>change(()=>{if(s.round===s.limit){s.ended=true;note('Game complete.')}else{s.round++;s.pot=0;s.die=null;s.p.forEach(p=>p.active=true);note('Round '+s.round+' started.')}}))}

function renderTarget(){const s=state();$('stage').innerHTML=hero(s.puzzle?s.puzzle.target:'?',s.puzzle?'Target · round '+s.round:'Generate a target to begin')+`<section class="panel"><div class="numbers">${s.puzzle?s.puzzle.nums.map(n=>'<div class="tile">'+n+'</div>').join(''):'<p class="muted">Six number tiles will appear here.</p>'}</div><div class="row">${btn('newTarget','New target','primary')}${btn('startTimer',timer?'Pause timer':'Start / resume timer','',!s.puzzle||s.seconds===0)}${btn('resetTimer','Reset timer','',!s.puzzle)}<b id="clock" style="font-size:30px;margin-left:auto">${s.seconds}s</b>${btn('revealTarget','Reveal one solution','gold',!s.puzzle||s.revealed)}</div><p class="muted">Use each tile at most once. You do not have to use every tile. Allowed: +, −, ×, ÷ and brackets. Intermediate results must be positive whole numbers.</p>${s.revealed?'<div class="solution">'+esc(s.puzzle.solution)+'</div>':''}</section><section class="panel teacherOnly"><h2>Award points</h2><p class="muted">Teacher checks the written calculation: exact target = 10; within 5 = 7; within 10 = 5. Each team can be scored once per target; Undo corrects a mistake.</p><div class="row"><div><label for="targetTeam">Team</label><select id="targetTeam">${options(s.p)}</select></div><div><label for="targetPoints">Checked result</label><select id="targetPoints"><option value="10">Exact · 10 points</option><option value="7">Within 5 · 7 points</option><option value="5">Within 10 · 5 points</option><option value="0">No valid result · 0</option></select></div>${btn('awardTarget','Award points','',!s.puzzle)}</div><p class="muted">Scored this target: ${s.awarded.map(i=>esc(s.p[i].name)).join(', ')||'none'}</p>${scorecards(s.p)}</section>`;

hook('newTarget',()=>{const level=$('difficulty').value,duration=Math.max(10,Math.min(600,+$('duration').value||60));stopTimer();change(()=>{s.level=level;s.duration=duration;s.seconds=duration;s.puzzle=G.targetPuzzle(level);s.round++;s.revealed=false;s.awarded=[];note('Target '+s.puzzle.target+' generated.')})});hook('resetTimer',()=>{const n=Math.max(10,Math.min(600,+$('duration').value||60));stopTimer();change(()=>{s.duration=n;s.seconds=n})});hook('startTimer',()=>{if(timer){stopTimer();save();render();return}deadline=Date.now()+s.seconds*1000;timer=setInterval(()=>{s.seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));timerText();if(s.seconds===0){stopTimer();note('Time is up.');save();render();msg('Time is up — show your calculations.')}},200);render()});hook('revealTarget',()=>{stopTimer();change(()=>{s.revealed=true;note('Solution revealed.')})});hook('awardTarget',()=>{const i=+$('targetTeam').value,n=+$('targetPoints').value;change(()=>{if(s.awarded.includes(i))throw Error('This team is already scored for this target. Use Undo to correct it.');s.p[i].score+=n;s.awarded.push(i);note(s.p[i].name+' scored '+n+' for target '+s.puzzle.target)})})}
function bingoLines(card,called){const set=new Set(called);return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].filter(line=>line.every(i=>set.has(card[i])))}

hook('bingoDraw',()=>change(()=>{const pool=G.products.filter(n=>!s.called.includes(n));if(!pool.length)throw Error('All products have been called.');const n=pool[rand(pool.length)];s.current={n,fact:G.fact(n)};s.called.push(n);s.revealed=false;note('Call '+s.called.length+' · '+s.current.fact.join(' × '))}));hook('bingoReveal',()=>change(()=>s.revealed=true));hook('makeBingo',()=>{const n=+$('cardCount').value;if(!Number.isInteger(n)||n<1||n>36){msg('Choose 1–36 cards.');return}change(()=>{s.cards=Array.from({length:n},()=>G.shuffle(G.products).slice(0,9));note(n+' student cards generated.')});printBingo()});hook('reprintBingo',printBingo);hook('checkBingo',()=>{const id=+$('cardId').value,card=s.cards[id-1];if(!Number.isInteger(id)||!card){$('bingoCheck').textContent='No generated card with that ID.';return}const lines=bingoLines(card,s.called);$('bingoCheck').textContent=lines.length?'✓ Winning line: '+lines[0].map(i=>card[i]).join(', '):'No complete winning line yet.'})}

function printCray(){const c=state().c;printHTML('<div class="sheet"><h1>Cray Pots · season ledger</h1><p>Team: ____________________</p><p>Start: $'+c.cash+', '+c.boats+' boats, '+c.pots+' pots. Boats: $'+c.boatCost+' each. Pots: $'+c.potCost+' each. Capacity: '+c.capacity+' deployed pots per boat.</p><p>Before each roll: buy with opening cash, then choose shallow/deep placement. Stored pots are safe. 1–3 calm; 4 repeat last weather (start calm); 5–6 storm.</p><p>Calm: shallow $'+c.shallowGood+'/pot, deep $'+c.deepGood+'/pot. Storm: shallow $'+c.shallowBad+'/pot; deep pots lost with no income.</p><table><tr>'+['Day','Opening $','Buy boats','Buy pots','Cost $','Shallow','Deep','Weather','Income $','Pots left','Closing $'].map(x=>'<th>'+x+'</th>').join('')+'</tr>'+Array.from({length:c.days},(_,i)=>'<tr><td>'+(i+1)+'</td>'+Array(10).fill('<td></td>').join('')+'</tr>').join('')+'</table><p>Closing cash = opening cash − purchase cost + income.</p><h2>Final value</h2><p>Cash ______ + boats ______ × $'+c.boatCost+' + pots ______ × $'+c.potCost+' = ______</p></div>')}
function printBingo(){const cards=state().cards;let html='';for(let start=0;start<cards.length;start+=6){html+='<div class="sheet"><h1>Multiplication Bingo</h1><p>Mark the answer to each fact. Complete a row, column or diagonal, then call Bingo.</p><div class="cardsprint">'+cards.slice(start,start+6).map((card,j)=>'<div class="bcard"><h2>Card '+(start+j+1)+'</h2><p>Name: __________________</p><table>'+Array.from({length:3},(_,r)=>'<tr>'+card.slice(r*3,r*3+3).map(n=>'<td>'+n+'</td>').join('')+'</tr>').join('')+'</table></div>').join('')+'</div></div>'}printHTML(html)}
function exportCSV(){const s=state(),quote=x=>'"'+String(x).replaceAll('"','""')+'"';let rows;if(mode==='pirate')rows=[['Name','Class row','Cash','Bank','Total','Shields','Mirrors'],...s.p.map(p=>[p.name,p.row,p.cash,p.bank,p.cash+p.bank,p.shield,p.mirror])];else if(mode==='cray')rows=[['Day','Name','Weather','Die','Cash','Boats','Pots','Shallow','Deep','Income','Lost','Net worth'],...s.records.flatMap(r=>r.teams.map(p=>[r.day,p.name,r.weather,r.die,p.cash,p.boats,p.pots,p.shallow,p.deep,p.income,p.lost,p.cash+p.boats*s.c.boatCost+p.pots*s.c.potCost]))];else if(mode==='bingo')rows=[['Call','Product'],...s.called.map((n,i)=>[i+1,n])];else rows=[['Name','Score'],...s.p.map(p=>[p.name,p.score])];const csv=rows.map(r=>r.map(quote).join(',')).join('\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=mode+'-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('newGame').onclick=()=>{try{const fresh=create();stopTimer();if(state())checkpoint();data.games[mode]=fresh;save();render()}catch(e){msg(e.message)}};
$('undo').onclick=()=>{stopTimer();const h=histories[mode];if(h?.length){data.games[mode]=h.pop();save();render()}};
$('project').onclick=()=>document.body.classList.add('project');$('exitProject').onclick=()=>document.body.classList.remove('project');$('export').onclick=exportCSV;
$('names').onchange=save;
window.addEventListener('hashchange',()=>{stopTimer();save();mode=games[location.hash.slice(1)]?location.hash.slice(1):'pirate';if(!data.games[mode])data.games[mode]=create();render()});
window.addEventListener('pagehide',()=>{stopTimer();save()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&timer){stopTimer();save();render()}});
if(!data.games[mode])data.games[mode]=create();render();
</script></body></html>
